    showToast('Toutes les catégories masquées');
  }));
  app.querySelectorAll('[data-show-all-cats]').forEach(el=>el.addEventListener('click', ()=>{
    mutateData(d=>{ d.hiddenBudgetCategories = []; });
    showToast('Toutes les catégories affichées');
  }));
  app.querySelectorAll('[data-open-hiddencat]').forEach(el=>el.addEventListener('click', ()=>{ state.hiddenCatModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-hiddencat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.hiddenCatModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-hiddencat]').forEach(el=>el.addEventListener('click', ()=>{ state.hiddenCatModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-unhide-budgetcat]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.unhideBudgetcat;
    mutateData(d=>{ d.hiddenBudgetCategories = d.hiddenBudgetCategories.filter(c=>c!==id); });
  }));

  app.querySelectorAll('[data-allocate-remaining]').forEach(el=>el.addEventListener('click', ()=>{
    const amount = Number(el.dataset.remainingAmount) || 0;
    state.allocateAmount = amount;
    state.allocateGoalMode = 'add';
    state.allocateIsRollover = false;
    state.allocateSource = el.dataset.allocateRemaining==='save' ? 'remaining' : null;
    state.allocateModalOpen = true;
    rerender();
  }));
  app.querySelectorAll('[data-allocate-quick]').forEach(el=>el.addEventListener('click', ()=>{
    const amount = Number(el.dataset.remainingAmount) || 0;
    state.allocateAmount = amount;
    state.allocateGoalMode = el.dataset.allocateQuick;
    state.allocateIsRollover = false;
    state.allocateSource = null;
    state.allocateModalOpen = true;
    rerender();
  }));
  app.querySelectorAll('[data-allocate-rollover]').forEach(el=>el.addEventListener('click', ()=>{
    const amount = Number(el.dataset.remainingAmount) || 0;
    state.allocateAmount = amount;
    state.allocateGoalMode = 'add';
    state.allocateIsRollover = true;
    state.allocateSource = null;
    state.allocateModalOpen = true;
    rerender();
  }));
  app.querySelectorAll('[data-close-allocate]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.allocateModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-allocate]').forEach(el=>el.addEventListener('click', ()=>{ state.allocateModalOpen=false; rerender(); }));

  app.querySelectorAll('[data-open-pincat]').forEach(el=>el.addEventListener('click', ()=>{ state.pinCatModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-pincat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.pinCatModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-pincat]').forEach(el=>el.addEventListener('click', ()=>{ state.pinCatModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-pin-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.pinCat;
    mutateData(d=>{ if(!d.pinnedCategories.includes(catId)) d.pinnedCategories.push(catId); });
    state.pinCatModalOpen = false;
    showToast('Catégorie épinglée');
  }));
  app.querySelectorAll('[data-unpin-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.unpinCat;
    mutateData(d=>{ d.pinnedCategories = d.pinnedCategories.filter(id=>id!==catId); });
  }));

  app.querySelectorAll('[data-open-gaugecat]').forEach(el=>el.addEventListener('click', ()=>{ state.gaugeCatModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-gaugecat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.gaugeCatModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-gaugecat]').forEach(el=>el.addEventListener('click', ()=>{ state.gaugeCatModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-gaugecat-add]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.gaugecatAdd;
    mutateData(d=>{ if(!d.gaugeAlwaysShow.includes(catId)) d.gaugeAlwaysShow.push(catId); });
    showToast('Catégorie toujours affichée');
  }));
  app.querySelectorAll('[data-gaugecat-remove]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.gaugecatRemove;
    mutateData(d=>{ d.gaugeAlwaysShow = d.gaugeAlwaysShow.filter(id=>id!==catId); });
    showToast('Catégorie retirée');
  }));

  app.querySelectorAll('[data-edit-builtin-color]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingBuiltinColorId = el.dataset.editBuiltinColor;
    rerender();
  }));
  app.querySelectorAll('[data-close-builtincolor]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.editingBuiltinColorId=null; rerender(); } }));
  app.querySelectorAll('[data-close-x-builtincolor]').forEach(el=>el.addEventListener('click', ()=>{ state.editingBuiltinColorId=null; rerender(); }));
  app.querySelectorAll('[data-builtincolor-pick]').forEach(el=>el.addEventListener('click', ()=>{
    const id = state.editingBuiltinColorId;
    const color = el.dataset.builtincolorPick;
    mutateData(d=>{ d.categoryColorOverrides[id] = color; });
    state.editingBuiltinColorId = null;
    showToast('Couleur mise à jour');
  }));
  app.querySelectorAll('[data-builtincolor-reset]').forEach(el=>el.addEventListener('click', ()=>{
    const id = state.editingBuiltinColorId;
    mutateData(d=>{ delete d.categoryColorOverrides[id]; });
    state.editingBuiltinColorId = null;
    showToast('Couleur réinitialisée');
  }));
  app.querySelectorAll('[data-allocate-mode]').forEach(el=>el.addEventListener('click', ()=>{
    state.allocateGoalMode = el.dataset.allocateMode;
    rerender();
  }));
  app.querySelectorAll('[data-allocate-to-goal]').forEach(el=>el.addEventListener('click', ()=>{
    const goalId = el.dataset.allocateToGoal;
    const input = document.getElementById('allocateAmountInput');
    const amount = Number(input ? input.value : state.allocateAmount);
    if(!amount || amount<=0) return;
    state.allocateModalOpen = false;
    if(state.allocateGoalMode==='withdraw'){ goalWithdraw(goalId, amount); }
    else {
      goalContribute(goalId, amount);
      if(state.allocateIsRollover){
        mutateData(d=>{ d.categoryRollover = {}; });
      }
      if(state.allocateSource==='remaining'){
        const key = state.viewY + '-' + state.viewM;
        mutateData(d=>{
          d.envelopeCommitted[key] = (d.envelopeCommitted[key]||0) + amount;
          if(d.transactions[0]) d.transactions[0].committedMonth = key;
        });
      }
    }
    state.allocateIsRollover = false;
    state.allocateSource = null;
  }));
  app.querySelectorAll('[data-setup-key]').forEach(el=>el.addEventListener('click', ()=>{ handleSetupDigit(el.dataset.setupKey); }));
  app.querySelectorAll('[data-setup-backspace]').forEach(el=>el.addEventListener('click', handleSetupBackspace));
  app.querySelectorAll('[data-enable-biometric]').forEach(el=>el.addEventListener('click', registerBiometric));
  app.querySelectorAll('[data-disable-lock]').forEach(el=>el.addEventListener('click', disableLock));
  app.querySelectorAll('[data-pin-key]').forEach(el=>el.addEventListener('click', ()=>{ handlePinDigit(el.dataset.pinKey); }));
  app.querySelectorAll('[data-pin-backspace]').forEach(el=>el.addEventListener('click', ()=>{ state.pinInput = state.pinInput.slice(0,-1); rerender(); }));
  app.querySelectorAll('[data-pin-biometric]').forEach(el=>el.addEventListener('click', tryBiometricUnlock));

  if(state.locked && state.data.security && state.data.security.useBiometric && !state.triedBiometricAuto){
    state.triedBiometricAuto = true;
    tryBiometricUnlock();
  }

  const balEl = document.getElementById('balanceNum');
  if(balEl){
    const today0 = new Date();
    const f0 = computeForecast();
    const target0 = balanceForViewedMonth(f0, state.viewY, state.viewM);
    animateBalance(balEl, target0);
  }

  const pageEl = app.querySelector('.page');
  if(pageEl){
    let sx=null, sy=null, sInScroll=false;
    pageEl.addEventListener('touchstart', (e)=>{
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      sInScroll = !!e.target.closest('.trend-scroll') || !!e.target.closest('.month-nav');
    }, {passive:true});
    pageEl.addEventListener('touchend', (e)=>{
      if(sx===null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      const wasInScroll = sInScroll;
      sx = null; sInScroll = false;
      if(wasInScroll) return;
      if(Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)*1.6){
        const order = ['dashboard','transactions','budgets','goals'];
        const idx = order.indexOf(state.tab);
        let next = idx;
        if(dx < 0 && idx < order.length-1) next = idx+1;
        if(dx > 0 && idx > 0) next = idx-1;
        if(next !== idx){ setState({tab: order[next]}); window.scrollTo(0,0); }
      }
    }, {passive:true});
  }
  const trendScroll = app.querySelector('.trend-scroll');
  if(trendScroll){ trendScroll.scrollLeft = trendScroll.scrollWidth; }

  app.querySelectorAll('.month-nav').forEach(navEl=>{
    if(!navEl.querySelector('[data-move]')) return;
    let mx=null, my=null;
    navEl.addEventListener('touchstart', (e)=>{
      mx = e.touches[0].clientX; my = e.touches[0].clientY;
      e.stopPropagation();
    }, {passive:true});
    navEl.addEventListener('touchend', (e)=>{
      if(mx===null) return;
      const dx = e.changedTouches[0].clientX - mx;
      const dy = e.changedTouches[0].clientY - my;
      mx = null;
      e.stopPropagation();
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.6){
        moveMonth(dx < 0 ? 1 : -1);
      }
    }, {passive:true});
  });
}

function animateBalance(el, target){
  if(state.balanceAnim.raf) cancelAnimationFrame(state.balanceAnim.raf);
  const from = state.balanceAnim.display;
  const start = performance.now();
  const duration = 650;
  function step(ts){
    const p = Math.min(1, (ts-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (target-from)*eased;
    state.balanceAnim.display = val;
    el.textContent = fmt0(val);
    if(p<1){ state.balanceAnim.raf = requestAnimationFrame(step); }
    else { state.balanceAnim.target = target; }
  }
  state.balanceAnim.raf = requestAnimationFrame(step);
}

rerender();
if(window.__soldeDataWasCorrupted){
  setTimeout(()=>{ showToast("Anciennes données illisibles — appli réinitialisée (sauvegarde technique conservée)"); }, 600);
}
</script>
</body>
</html>
