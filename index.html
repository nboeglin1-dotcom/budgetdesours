<style>
  :root{
    color-scheme: dark;
    --bg:#0E1626; --surface:#151F35; --surfaceHi:#1C2A47;
    --line:#2B3B5C; --lineSoft:#1E2C48;
    --paper:#F2EDDE; --paperDim:#96A0BC;
    --gold:#D4A94F; --coral:#E8664D; --sage:#6FA287;
    --violet:#8B7FD6; --teal:#5FB4C4; --rose:#D6829F; --slate:#7C89A6; --amber:#C97B3F; --mint:#4FBF8B;
  }
  input:not([type="checkbox"]), .field-input, .budget-limit-edit input, .goal-form input, .search-wrap input{
    -webkit-appearance:none; appearance:none; color-scheme: dark;
  }
  input[type="checkbox"]{ -webkit-appearance:auto; appearance:auto; color-scheme: dark; }
  input::-webkit-date-and-time-value{ text-align:left; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--paper); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .ledger{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  button{cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; touch-action:manipulation;}
  button:active{transform:scale(0.96); transition:transform .08s ease;}
  .tabbar button:active, .cat-opt:active, .color-swatch:active{transform:scale(0.92);}
  a, input, .card, .txrow{touch-action:manipulation;}
  input{font-family:inherit; font-size:inherit; color:inherit;}
  input:focus, button:focus{outline:none;}
  ::selection{background:var(--gold); color:var(--bg);}
  #app{max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .page{animation:pageIn .22s ease both;}
  @keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .scroll-cats, .modal-sheet{-webkit-overflow-scrolling:touch;}
  .header{position:sticky; top:0; z-index:20; background:rgba(14,22,38,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--gold); color:var(--bg);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;}
  .brand-name{font-size:17px; font-weight:600; line-height:1; color:var(--paper) !important;}
  .brand-sub{font-size:10.5px; color:var(--paperDim); margin-top:2px;}
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(21,31,53,.96); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); display:flex; padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);}

<div id="app"></div>
<script>
window.addEventListener('error', function(e){
  try{
    var el = document.getElementById('app');
    if(el){
      el.innerHTML = '<div style="padding:50px 22px; color:#F2EDDE; font-family:sans-serif; line-height:1.5;">'
        + '<div style="font-size:20px; font-weight:700; color:#E8664D; margin-bottom:10px;">Un problème est survenu</div>'

        + '<div style="font-size:12px; opacity:.6; margin-top:14px;">Ligne : ' + (e && e.lineno ? e.lineno : '?') + '</div>'
        + '</div>';
    }
  }catch(err){}
});
/* ---------------- data model ---------------- */
const COLORS = { gold:'#D4A94F', coral:'#E8664D', sage:'#6FA287', violet:'#8B7FD6', teal:'#5FB4C4', rose:'#D6829F', slate:'#7C89A6', amber:'#C97B3F', mint:'#4FBF8B' };

const EXPENSE_CATS = [
  {id:'alimentation', label:'Alimentation', color:COLORS.coral, type:'expense'},
  {id:'logement', label:'Logement', color:COLORS.gold, type:'expense'},
  {id:'transport', label:'Transport', color:COLORS.sage, type:'expense'},
  {id:'loisirs', label:'Loisirs', color:COLORS.violet, type:'expense'},
  {id:'sante', label:'Santé', color:COLORS.teal, type:'expense'},
  {id:'shopping', label:'Shopping', color:COLORS.rose, type:'expense'},
  {id:'abonnements', label:'Abonnements', color:COLORS.amber, type:'expense'},
  {id:'epargne', label:'Dépôt sur épargne', color:COLORS.mint, type:'expense'},
  {id:'autres_d', label:'Autres', color:COLORS.slate, type:'expense'},
];
const INCOME_CATS = [
  {id:'salaire', label:'Salaire', color:COLORS.gold, type:'income'},
  {id:'freelance', label:'Freelance', color:COLORS.sage, type:'income'},
  {id:'epargne_retour', label:"Retrait d'épargne", color:COLORS.mint, type:'income'},
  {id:'autres_i', label:'Autres', color:COLORS.slate, type:'income'},
];
const ALL_CATS = [...EXPENSE_CATS, ...INCOME_CATS];

function catInfo(id){
  const custom = (state.data.customCategories||[]).find(c=>c.id===id);
  if(custom) return custom;
  return ALL_CATS.find(c=>c.id===id) || EXPENSE_CATS[7];
}
function catsForType(type){
  const custom = (state.data.customCategories||[]).filter(c=>c.type===type);
  return [...(type==='expense'?EXPENSE_CATS:INCOME_CATS), ...custom];
}
function freqLabel(f){ return {weekly:'Chaque semaine', monthly:'Chaque mois', yearly:'Chaque année'}[f] || f; }
function addPeriod(date, freq){
  const d = new Date(date);
  if(freq==='weekly') d.setDate(d.getDate()+7);
  else if(freq==='yearly') d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d;
}

const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MONTHS_SHORT = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

const fmt0 = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const fmt2 = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const uid = () => Math.random().toString(36).slice(2,10);
const sameMonth = (iso,y,m) => { const d=new Date(iso); return d.getFullYear()===y && d.getMonth()===m; };

const STORAGE_KEY = 'solde-budget-data-v1';

function seedData(){
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth();
  const d=(day,off=0)=> new Date(y, m+off, day).toISOString();
  return {
    transactions:[
      {id:uid(),type:'income',amount:2400,category:'salaire',note:'Salaire',date:d(1)},
      {id:uid(),type:'expense',amount:780,category:'logement',note:'Loyer',date:d(2)},
      {id:uid(),type:'expense',amount:62,category:'alimentation',note:'Courses Monoprix',date:d(4)},
      {id:uid(),type:'expense',amount:45,category:'transport',note:'Pass Navigo',date:d(3)},
      {id:uid(),type:'expense',amount:15,category:'abonnements',note:'Spotify + Netflix',date:d(5)},
      {id:uid(),type:'expense',amount:38,category:'loisirs',note:'Cinéma',date:d(8)},
      {id:uid(),type:'expense',amount:120,category:'shopping',note:'Vêtements',date:d(10)},
      {id:uid(),type:'income',amount:350,category:'freelance',note:'Mission graphisme',date:d(12)},
      {id:uid(),type:'expense',amount:54,category:'alimentation',note:'Courses',date:d(14)},
      {id:uid(),type:'expense',amount:25,category:'sante',note:'Pharmacie',date:d(15)},
      {id:uid(),type:'income',amount:2400,category:'salaire',note:'Salaire',date:d(1,-1)},
      {id:uid(),type:'expense',amount:1450,category:'logement',note:'Charges du mois',date:d(20,-1)},
      {id:uid(),type:'income',amount:2400,category:'salaire',note:'Salaire',date:d(1,-2)},
      {id:uid(),type:'expense',amount:1680,category:'shopping',note:'Divers',date:d(20,-2)},
    ],
    budgets:{alimentation:350, logement:800, transport:100, loisirs:120, sante:60, shopping:150, abonnements:40, autres_d:100},
    goals:[
      {id:uid(), name:"Fonds d'urgence", target:3000, current:1200, color:COLORS.sage},
      {id:uid(), name:'Voyage au Japon', target:2500, current:640, color:COLORS.violet},
    ],
    customCategories:[],
    recurring:[],
  };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.customCategories) parsed.customCategories = [];
      if(!parsed.recurring) parsed.recurring = [];
      return parsed;
    }
  }catch(e){}
  const seeded = seedData();
  saveData(seeded);
  return seeded;
}
function saveData(d){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){} }

/* ---------------- state ---------------- */
const now = new Date();
let state = {
  data: loadData(),
  tab: 'dashboard',
  viewY: now.getFullYear(),
  viewM: now.getMonth(),
  modal: null,
  categoryModalOpen: false,
  manageCatOpen: false,
  recurringModalOpen: false,
  toast: null,
  txFilter: 'all',
  txQuery: '',
  selectedTx: [],
  balanceAnim: { display: 0, target: 0, raf: null },
};

function processRecurring(){
  const today = new Date();
  let changed = false;
  (state.data.recurring||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while(next <= today && guard < 60){
      state.data.transactions.unshift({ id: uid(), type: rule.type, amount: rule.amount, category: rule.category, note: rule.note, date: next.toISOString() });
      next = addPeriod(next, rule.frequency);
      guard++;
      changed = true;
    }
    rule.nextDate = next.toISOString();
  });
  if(changed) saveData(state.data);
}
processRecurring();

function setState(patch){ Object.assign(state, patch); rerender(); }
function mutateData(fn){ fn(state.data); saveData(state.data); rerender(); }
function showToast(msg){
  state.toast = { msg, undo:null }; rerender();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; rerender(); }, 2200);
}
function showUndoToast(msg, undoFn){
  state.toast = { msg, undo: undoFn }; rerender();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; rerender(); }, 4500);
}
function goalContribute(id, amt){
  let goalName = '';
  mutateData(d=>{
    const g=d.goals.find(g=>g.id===id);
    if(g){
      goalName = g.name;
      g.current = Math.max(0,g.current+amt);
      d.transactions.unshift({ id:uid(), type:'expense', amount:amt, category:'epargne', note:`Vers "${g.name}"`, date:new Date().toISOString() });
    }
  });
  showToast(`+${fmt0(amt)} vers ${goalName || "l'objectif"} — déduit du solde`);
}
function goalWithdraw(id, amt){
  let goalName = '';
  mutateData(d=>{
    const g=d.goals.find(g=>g.id===id);
    if(g){
      goalName = g.name;
      g.current = Math.max(0,g.current-amt);
      d.transactions.unshift({ id:uid(), type:'income', amount:amt, category:'epargne_retour', note:`Retrait de "${g.name}"`, date:new Date().toISOString() });
    }
  });
  showToast(`${fmt0(amt)} retirés de ${goalName || "l'objectif"} — ajoutés au solde`);
}
function openEditTx(id){
  const t = state.data.transactions.find(t=>t.id===id);
  if(!t) return;
  txFormState = { type:t.type, category:t.category, date:new Date(t.date).toISOString().slice(0,10), recurring:false, frequency:'monthly', note:t.note||'', amount:t.amount, editingId:t.id };
  setState({modal:'addTx'});
}

function monthTx(){ return state.data.transactions.filter(t=>sameMonth(t.date, state.viewY, state.viewM)); }
function moveMonth(delta){
  let m = state.viewM + delta, y = state.viewY;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  setState({viewY:y, viewM:m});
}
function totalBalance(){ return state.data.transactions.reduce((s,t)=> s + (t.type==='income'? t.amount : -t.amount), 0); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function rerender(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const scrollY = window.scrollY;
  document.getElementById('app').innerHTML = renderApp();
  bindEvents();

    if(el){ el.focus(); if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  } else { window.scrollTo(0, scrollY); }
}

/* ---------------- Dashboard ---------------- */
function computeForecast(){
  const today = new Date();
  const months = [];
  for(let i=2;i>=0;i--){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){m+=12;y--;}
    months.push({y,m});
  }
  const incomes = [], expenses = [];
  months.forEach(({y,m})=>{
    const txs = state.data.transactions.filter(t=>sameMonth(t.date,y,m));
    incomes.push(txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
    expenses.push(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  });
  const avgIncome = incomes.reduce((a,b)=>a+b,0)/incomes.length;
  const avgExpense = expenses.reduce((a,b)=>a+b,0)/expenses.length;
  const netAvg = avgIncome - avgExpense;
  const startBalance = totalBalance();
  const points = [];
  let bal = startBalance;
  for(let i=1;i<=6;i++){
    let m = today.getMonth()+i, y = today.getFullYear();
    while(m>11){ m-=12; y++; }
    bal += netAvg;
    points.push({ label: `${MONTHS_SHORT[m]} ${String(y).slice(2)}`, value: bal, y, m });
  }
  return { points, avgIncome, avgExpense, netAvg, startBalance };
}

function computeCategoryForecast(targetExpense){
  const today = new Date();
  const months = [];
  for(let i=2;i>=0;i--){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){m+=12;y--;}
    months.push({y,m});
  }
  const totals = {};
  let grandTotal = 0;
  months.forEach(({y,m})=>{
    state.data.transactions.filter(t=>t.type==='expense' && sameMonth(t.date,y,m)).forEach(t=>{
      totals[t.category] = (totals[t.category]||0) + t.amount;
      grandTotal += t.amount;
    });
  });
  if(grandTotal <= 0) return [];
  return Object.entries(totals)
    .map(([id,sum])=>({ id, value: (sum/grandTotal)*targetExpense, ...catInfo(id) }))
    .sort((a,b)=>b.value-a.value);
}

function monthIndex(y,m){ return y*12+m; }

function balanceForViewedMonth(f, viewY, viewM){
  const today = new Date();
  const curIdx = monthIndex(today.getFullYear(), today.getMonth());
  const viewIdx = monthIndex(viewY, viewM);
  const diff = viewIdx - curIdx;
  if(diff <= 0){
    const cutoff = new Date(viewY, viewM+1, 0, 23,59,59,999);
    return state.data.transactions
      .filter(t => new Date(t.date) <= cutoff)
      .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
  }
  if(diff <= 6) return f.points[diff-1].value;
  return f.startBalance + f.netAvg*diff;
}

  const f = computeForecast();
  const maxAbs = Math.max(1, f.startBalance, ...f.points.map(p=>Math.abs(p.value)));
  return `
    <div class="card">
      <div class="section-title" style="font-size:15px; margin-bottom:4px;">Prévisionnel — 6 prochains mois</div>
      <div style="font-size:12px; color:var(--paperDim); margin-bottom:14px; line-height:1.5;">
        Basé sur votre moyenne des 3 derniers mois : ${fmt0(f.avgIncome)} de revenus, ${fmt0(f.avgExpense)} de dépenses
        (soit ${f.netAvg>=0?'+':'−'}${fmt0(Math.abs(f.netAvg))} par mois).
      </div>
      <div style="display:flex; flex-direction:column; gap:2px;">
        ${f.points.map((p,i)=>`
          <button data-goto-month="${p.y}-${p.m}" class="row" style="margin-bottom:0; padding:9px 0; width:100%; text-align:left; ${i<f.points.length-1?`border-bottom:1px solid var(--lineSoft);`:''}">
            <span style="font-size:13px; color:var(--paperDim);">${p.label}</span>
            <div style="display:flex; align-items:center; gap:10px; flex:1; max-width:60%;">
              <div class="catbar-track" style="flex:1; margin:0;">
                <div class="catbar-fill" style="width:${Math.min(100, Math.abs(p.value)/maxAbs*100)}%; background:${p.value<0?'var(--coral)':'var(--gold)'};"></div>
              </div>
              <span class="mono" style="font-size:13.5px; font-weight:600; color:${p.value<0?'var(--coral)':'var(--paper)'}; white-space:nowrap;">${fmt0(p.value)}</span>
              ${icon('chevronR',14)}
            </div>
          </button>
        `).join('')}

    </div>
  `;
}

function renderDashboard(){
  const today = new Date();
  const curIdx = monthIndex(today.getFullYear(), today.getMonth());
  const viewIdx = monthIndex(state.viewY, state.viewM);
  const isFuture = viewIdx > curIdx;

  const f = computeForecast();
  const tx = monthTx();
  const income = isFuture ? f.avgIncome : tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = isFuture ? f.avgExpense : tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const savings = income - expense;
  const rate = income>0 ? Math.max(0, Math.round(savings/income*100)) : 0;
  const bal = balanceForViewedMonth(f, state.viewY, state.viewM);

  const byCat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const catData = isFuture ? computeCategoryForecast(expense) : Object.entries(byCat).map(([id,value])=>({id,value,...catInfo(id)})).sort((a,b)=>b.value-a.value);
  const maxCat = Math.max(1, ...catData.map(c=>c.value));

  const trend = [];
  for(let i=11;i>=0;i--){
    let m = state.viewM-i, y=state.viewY;
    if(m<0){m+=12;y--;}
    const txs = state.data.transactions.filter(t=>sameMonth(t.date,y,m));
    trend.push({ label: MONTHS_SHORT[m], inc: txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0), exp: txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0) });
  }
  const maxTrend = Math.max(1, ...trend.map(t=>Math.max(t.inc,t.exp)));

  const over = Object.entries(state.data.budgets)
    .map(([id,limit])=>({id,limit,spent:byCat[id]||0,...catInfo(id)}))
    .filter(b=>b.limit>0 && b.spent/b.limit>=0.8);

  return `
    <div class="row" style="margin-bottom:14px;">
      ${monthNav()}
      <button class="btn-primary" data-open="addTx">${icon('plus',14)} Ajouter</button>
    </div>
    <div class="card ruled">
      <div class="eyebrow">Solde total${isFuture ? ` <span style="color:var(--gold);">· estimé</span>` : ''}</div>
      <div class="balance-num mono" id="balanceNum">${fmt0(bal)}</div>
      <div style="display:flex; gap:22px; flex-wrap:wrap; margin-top:16px;">
        <div><div class="stat-label">${icon('up',12)} Revenus du mois</div><div class="stat-val" style="color:var(--sage)">${fmt2(income)}</div></div>
        <div><div class="stat-label">${icon('down',12)} Dépenses du mois</div><div class="stat-val" style="color:var(--coral)">${fmt2(expense)}</div></div>
        <div><div class="stat-label">Taux d'épargne</div><div class="stat-val" style="color:var(--gold)">${rate}%</div></div>
      </div>
    </div>
    ${over.length ? `<div class="alert">${icon('alert',16)}<div><strong>Attention : </strong>${over.map(b=>b.label).join(', ')} ${over.length>1?'approchent ou dépassent':'approche ou dépasse'} la limite fixée ce mois-ci.</div></div>` : ''}
    <div class="card">
      <div class="section-title" style="font-size:15px; margin-bottom:12px;">Répartition des dépenses${isFuture ? ` <span style="color:var(--gold); font-size:12px; font-weight:500;">· estimée</span>` : ''}</div>
      ${catData.length===0 ? `<div class="empty">${isFuture ? "Pas assez d'historique pour estimer une répartition." : "Aucune dépense ce mois-ci"}</div>` : `
        <div class="scroll-cats">
          ${catData.map(c=>`
            <div class="catbar-row">
              <div class="row" style="margin-bottom:0;">
                <span style="font-size:12.5px; color:var(--paperDim); display:flex; align-items:center; gap:7px;"><span style="width:8px;height:8px;border-radius:50%;background:${c.color};display:inline-block;"></span>${c.label}</span>
                <span class="mono" style="font-size:12.5px;">${fmt0(c.value)}</span>
              </div>
              <div class="catbar-track"><div class="catbar-fill" style="width:${(c.value/maxCat*100).toFixed(1)}%; background:${c.color};"></div></div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
    <div class="card">
      <div class="section-title" style="font-size:15px; margin-bottom:2px;">Revenus vs dépenses — 12 mois</div>
      <div style="font-size:11px; color:var(--paperDim); margin-bottom:4px;">Faites glisser pour voir plus de mois →</div>
      <div class="trend-scroll">
        <div class="chart-bars">
          ${trend.map(t=>`
            <div class="chart-col">
              <div class="chart-bars-pair">
                <div class="chart-bar" style="height:${Math.max(2,t.inc/maxTrend*100)}px; background:var(--sage);"></div>
                <div class="chart-bar" style="height:${Math.max(2,t.exp/maxTrend*100)}px; background:var(--coral);"></div>
              </div>
              <div class="chart-label">${t.label}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="legend"><span><span class="dot" style="background:var(--sage)"></span>Revenus</span><span><span class="dot" style="background:var(--coral)"></span>Dépenses</span></div>
    </div>
    ${renderForecastCard()}
    <div class="card">
      <div class="section-title" style="font-size:15px; margin-bottom:6px;">Dernières écritures</div>
      ${tx.length===0 ? `<div class="empty">Rien à afficher pour ce mois</div>` : tx.slice(0,5).map(t=>txRow(t,false)).join('')}
    </div>
  `;
}

/* ---------------- Budgets ---------------- */
let budgetEditingId = null;
function renderBudgets(){
  const tx = monthTx();
  const byCat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const allExpenseCats = catsForType('expense');

  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Budgets par catégorie</div>
      ${monthNav()}
    </div>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn-ghost" data-open-managecat="1" style="font-size:12px; display:flex; align-items:center; gap:5px;">${icon('tag',13)} Gérer les catégories</button>
    </div>
    <div class="grid2">
      ${allExpenseCats.map(cat=>{
        const limit = state.data.budgets[cat.id] || 0;
        const spent = byCat[cat.id] || 0;
        const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
        const over = limit>0 && spent>limit;
        const barColor = over ? COLORS.coral : (pct>=80 ? COLORS.amber : cat.color);
        const editing = budgetEditingId === cat.id;
        return `
          <div class="card" style="margin-bottom:0;">
            <div class="budget-head">
              <div class="budget-cat"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${cat.color};display:inline-block;"></span>${cat.label}</div>
              ${editing ? `<div class="budget-limit-edit"><input id="budgetInput-${cat.id}" type="number" value="${limit}"><button data-save-budget="${cat.id}">OK</button></div>` : `<button class="budget-limit-btn" data-edit-budget="${cat.id}">limite : <span class="mono" style="color:var(--paper)">${fmt0(limit)}</span></button>`}
            </div>
            <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${barColor};"></div></div>
            <div class="budget-foot"><span class="mono" style="color:${over?'var(--coral)':'var(--paperDim)'}">${fmt2(spent)} dépensés</span><span>${limit>0? pct+'%' : '—'}</span></div>
            <div class="quick-chips" style="margin-top:10px;">
              ${[10,50].map(v=>`<button class="chip chip-add" data-budget-adjust="${cat.id}" data-amt="${v}">+${v}€</button>`).join('')}
              ${[10,50].map(v=>`<button class="chip chip-sub" data-budget-adjust="${cat.id}" data-amt="${-v}">−${v}€</button>`).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ---------------- Goals ---------------- */
function renderGoals(){
  const goals = state.data.goals;
  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Objectifs d'épargne</div>
      <button class="btn-primary" data-open="addGoal">${icon('plus',14)} Nouvel objectif</button>
    </div>
    ${goals.length===0 ? `<div class="card empty">Aucun objectif pour l'instant. Créez-en un pour commencer à mettre de côté.</div>` : `
      <div class="grid2">
        ${goals.map(g=>{
          const pct = g.target>0 ? Math.min(100, Math.round(g.current/g.target*100)) : 0;
          const done = pct>=100;
          return `
            <div class="card goal-card" style="margin-bottom:0;">
              ${done ? `<div class="goal-badge">${icon('spark',11)} Atteint</div>` : ''}
              <div class="goal-name">${escapeHtml(g.name)}</div>
              <div class="goal-amt" style="color:${g.color}">${fmt0(g.current)} <span class="target">/ ${fmt0(g.target)}</span></div>
              <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${g.color};"></div></div>
              <div class="quick-chips">
                ${[10,50,100].map(v=>`<button class="chip chip-add" data-quick-contribute="${g.id}" data-amt="${v}">+${v}€</button>`).join('')}
                ${[10,50].map(v=>`<button class="chip chip-sub" data-quick-withdraw="${g.id}" data-amt="${v}">−${v}€</button>`).join('')}
              </div>
              <div class="goal-form">
                <input id="goalAmount-${g.id}" type="number" placeholder="Autre montant">
                <button class="add" data-contribute="${g.id}">Ajouter</button>
                <button class="withdraw" data-withdraw="${g.id}">Retirer</button>
                <button class="del" data-del-goal="${g.id}">${icon('trash',14)}</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

/* ---------------- Modals ---------------- */
let txFormState = { type:'expense', category:EXPENSE_CATS[0].id, date:new Date().toISOString().slice(0,10), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null };
function renderAddTxModal(){
  const cats = catsForType(txFormState.type);
  const isEditing = !!txFormState.editingId;
  return `
    <div class="modal-overlay" data-close-modal="1">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-head"><div class="modal-title ledger">${isEditing ? 'Modifier la transaction' : 'Nouvelle transaction'}</div><button data-close-x-modal="1">${icon('x',18)}</button></div>
        <div class="type-toggle">
          <button data-tx-type="expense" style="background:${txFormState.type==='expense'?'var(--coral)':'transparent'}; color:${txFormState.type==='expense'?'var(--bg)':'var(--paperDim)'}">Dépense</button>
          <button data-tx-type="income" style="background:${txFormState.type==='income'?'var(--sage)':'transparent'}; color:${txFormState.type==='income'?'var(--bg)':'var(--paperDim)'}">Revenu</button>
        </div>
        <label class="field-label">Montant</label>
        <input id="txAmount" type="number" class="field-input amount" placeholder="0,00 €" value="${txFormState.amount || ''}">
        <label class="field-label">Catégorie</label>
        <div class="cat-grid">
          ${cats.map(c=>`
            <button data-tx-cat="${c.id}" class="cat-opt" style="border-color:${txFormState.category===c.id?c.color:'var(--line)'}; background:${txFormState.category===c.id?c.color+'22':'var(--surfaceHi)'}">
              <span class="dot" style="background:${c.color}"></span><span>${c.label}</span>
            </button>
          `).join('')}
          <button data-open-newcat="1" class="cat-opt" style="border-style:dashed;">
            <span style="font-size:16px; line-height:1;">+</span><span>Nouvelle</span>
          </button>
        </div>
        <label class="field-label">Note (facultatif)</label>
        <input id="txNote" class="field-input" placeholder="Ex : courses de la semaine" value="${escapeHtml(txFormState.note || '')}">
        <label class="field-label">Date</label>
        <input id="txDate" type="date" class="field-input mono" value="${txFormState.date}">
        ${!isEditing ? `
          <div class="row" style="margin-bottom:10px;">
            <label class="field-label" style="margin:0;">Transaction récurrente</label>
            <button data-toggle-recurring="1" class="toggle-switch ${txFormState.recurring?'on':''}">${txFormState.recurring?'Activée':'Désactivée'}</button>
          </div>
          ${txFormState.recurring ? `
            <div class="freq-row">
              ${['weekly','monthly','yearly'].map(f=>`<button data-freq="${f}" class="${txFormState.frequency===f?'active':''}">${freqLabel(f)}</button>`).join('')}
            </div>
          ` : ''}
        ` : ''}
        <button class="submit-btn" data-submit-tx="1">${isEditing ? 'Enregistrer les modifications' : 'Enregistrer'}</button>
      </div>
    </div>
  `;
}

/* ---------------- events ---------------- */
function onTxSearch(v){ state.txQuery = v; rerender(); }
window.onTxSearch = onTxSearch;

function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.tab === state.tab) return;
    setState({tab: el.dataset.tab});
    window.scrollTo(0,0);
  }));
  app.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click', ()=> moveMonth(Number(el.dataset.move))));
  app.querySelectorAll('[data-goto-today]').forEach(el=>el.addEventListener('click', ()=>{
    const today = new Date();
    setState({ viewY: today.getFullYear(), viewM: today.getMonth() });
  }));
  app.querySelectorAll('[data-goto-month]').forEach(el=>el.addEventListener('click', ()=>{
    const [y,m] = el.dataset.gotoMonth.split('-').map(Number);
    setState({ viewY: y, viewM: m });
    window.scrollTo(0,0);
  }));
  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.open==='addTx'){ txFormState = { type:'expense', category:EXPENSE_CATS[0].id, date:new Date().toISOString().slice(0,10), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null }; }
    if(el.dataset.open==='addGoal'){ goalFormState = { color: COLORS.sage }; }
    setState({modal: el.dataset.open});
  }));
  app.querySelectorAll('[data-quick-add]').forEach(el=>el.addEventListener('click', ()=>{
    const type = el.dataset.quickAdd;
    txFormState = { type, category:(type==='expense'?EXPENSE_CATS:INCOME_CATS)[0].id, date:new Date().toISOString().slice(0,10), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null };
    setState({modal:'addTx'});
    const amtEl = document.getElementById('txAmount');
    if(amtEl) amtEl.focus();
  }));
  app.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ setState({modal:null}); } }));
  app.querySelectorAll('[data-close-x-modal]').forEach(el=>el.addEventListener('click', ()=>{ setState({modal:null}); }));

  app.querySelectorAll('[data-del-tx]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.delTx;
    const tx = state.data.transactions.find(t=>t.id===id);
    if(!tx) return;
    mutateData(d=>{ d.transactions = d.transactions.filter(t=>t.id!==id); });
    showUndoToast('Transaction supprimée', ()=>{ mutateData(d=>{ d.transactions.unshift(tx); }); });
  }));
  app.querySelectorAll('[data-check-tx]').forEach(el=>el.addEventListener('change', ()=>{
    const id = el.dataset.checkTx;
    const sel = state.selectedTx||[];
    state.selectedTx = sel.includes(id) ? sel.filter(x=>x!==id) : [...sel, id];
    rerender();
  }));
  app.querySelectorAll('[data-clear-selection]').forEach(el=>el.addEventListener('click', ()=>{ state.selectedTx = []; rerender(); }));
  app.querySelectorAll('[data-delete-selected]').forEach(el=>el.addEventListener('click', ()=>{
    const ids = state.selectedTx||[];
    if(ids.length===0) return;
    const removed = state.data.transactions.filter(t=>ids.includes(t.id));
    mutateData(d=>{ d.transactions = d.transactions.filter(t=>!ids.includes(t.id)); });
    state.selectedTx = [];
    showUndoToast(`${removed.length} transaction${removed.length>1?'s':''} supprimée${removed.length>1?'s':''}`, ()=>{ mutateData(d=>{ d.transactions.unshift(...removed); }); });
  }));
  app.querySelectorAll('[data-edit-tx]').forEach(el=>el.addEventListener('click', ()=>{ openEditTx(el.dataset.editTx); }));
  app.querySelectorAll('[data-view-tx]').forEach(el=>el.addEventListener('click', ()=>{ openEditTx(el.dataset.viewTx); }));
  app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click', ()=> setState({txFilter: el.dataset.filter})));

  app.querySelectorAll('[data-edit-budget]').forEach(el=>el.addEventListener('click', ()=>{ budgetEditingId = el.dataset.editBudget; rerender(); }));
  app.querySelectorAll('[data-save-budget]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.saveBudget;
    const input = document.getElementById('budgetInput-'+id);
    const val = Number(input.value)||0;
    budgetEditingId = null;
    mutateData(d=>{ d.budgets[id] = val; });
  }));
  app.querySelectorAll('[data-budget-adjust]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.budgetAdjust;
    const delta = Number(el.dataset.amt);
    let newLimit = 0;
    mutateData(d=>{
      const current = d.budgets[id] || 0;
      newLimit = Math.max(0, current + delta);
      d.budgets[id] = newLimit;
    });
    showToast(`Limite ${catInfo(id).label} : ${fmt0(newLimit)}`);
  }));

  app.querySelectorAll('[data-contribute]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.contribute;
    const input = document.getElementById('goalAmount-'+id);
    const amt = Number(input.value);
    if(amt>0) goalContribute(id, amt);
  }));
  app.querySelectorAll('[data-withdraw]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.withdraw;
    const input = document.getElementById('goalAmount-'+id);
    const amt = Number(input.value);
    if(amt>0) goalWithdraw(id, amt);
  }));
  app.querySelectorAll('[data-quick-contribute]').forEach(el=>el.addEventListener('click', ()=>{
    goalContribute(el.dataset.quickContribute, Number(el.dataset.amt));
  }));
  app.querySelectorAll('[data-quick-withdraw]').forEach(el=>el.addEventListener('click', ()=>{
    goalWithdraw(el.dataset.quickWithdraw, Number(el.dataset.amt));
  }));
  app.querySelectorAll('[data-del-goal]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.goals = d.goals.filter(g=>g.id!==el.dataset.delGoal); }); }));

  app.querySelectorAll('[data-tx-type]').forEach(el=>el.addEventListener('click', ()=>{
    txFormState.type = el.dataset.txType;
    txFormState.category = (el.dataset.txType==='expense'?EXPENSE_CATS:INCOME_CATS)[0].id;
    rerender();
  }));
  app.querySelectorAll('[data-tx-cat]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.category = el.dataset.txCat; rerender(); }));
  app.querySelectorAll('[data-toggle-recurring]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.recurring = !txFormState.recurring; rerender(); }));
  app.querySelectorAll('[data-freq]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.frequency = el.dataset.freq; rerender(); }));

  const submitTx = app.querySelector('[data-submit-tx]');
  if(submitTx) submitTx.addEventListener('click', ()=>{
    const amount = Number(document.getElementById('txAmount').value);
    if(!amount || amount<=0) return;
    const note = document.getElementById('txNote').value;
    const date = document.getElementById('txDate').value;
    const isoDate = new Date(date).toISOString();
    if(txFormState.editingId){
      const editId = txFormState.editingId;
      mutateData(d=>{
        const t = d.transactions.find(t=>t.id===editId);
        if(t){ t.type=txFormState.type; t.amount=amount; t.category=txFormState.category; t.note=note; t.date=isoDate; }
      });
      state.modal = null;
      showToast('Transaction modifiée');
      return;
    }
    mutateData(d=>{
      d.transactions.unshift({ id:uid(), type:txFormState.type, amount, category:txFormState.category, note, date: isoDate });
      if(txFormState.recurring){
        d.recurring.push({ id:uid(), type:txFormState.type, amount, category:txFormState.category, note, frequency:txFormState.frequency, nextDate: addPeriod(isoDate, txFormState.frequency).toISOString() });
      }
    });
    state.modal = null;
    showToast(txFormState.recurring ? 'Récurrence créée' : (txFormState.type==='income' ? 'Entrée ajoutée' : 'Dépense ajoutée'));
  });

  app.querySelectorAll('[data-goal-color]').forEach(el=>el.addEventListener('click', ()=>{ goalFormState.color = el.dataset.goalColor; rerender(); }));
  const submitGoal = app.querySelector('[data-submit-goal]');
  if(submitGoal) submitGoal.addEventListener('click', ()=>{
    const name = document.getElementById('goalName').value.trim();
    const target = Number(document.getElementById('goalTarget').value);
    if(!name || !target || target<=0) return;
    mutateData(d=>{ d.goals.push({ id:uid(), name, target, current:0, color:goalFormState.color }); });
    state.modal = null;
    showToast('Objectif créé');
  });

  app.querySelectorAll('[data-open-newcat]').forEach(el=>el.addEventListener('click', ()=>{
    newCatFormState = { color: COLORS.slate, type: txFormState.type, label:'', editingId:null };
    state.categoryModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-open-newcat-standalone]').forEach(el=>el.addEventListener('click', ()=>{
    newCatFormState = { color: COLORS.slate, type: 'expense', label:'', editingId:null };
    state.categoryModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-edit-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const cat = (state.data.customCategories||[]).find(c=>c.id===el.dataset.editCat);
    if(!cat) return;
    newCatFormState = { color: cat.color, type: cat.type, label: cat.label, editingId: cat.id };
    state.categoryModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-close-newcat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.categoryModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-newcat]').forEach(el=>el.addEventListener('click', ()=>{ state.categoryModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-newcat-type]').forEach(el=>el.addEventListener('click', ()=>{ newCatFormState.type = el.dataset.newcatType; rerender(); }));
  app.querySelectorAll('[data-newcat-color]').forEach(el=>el.addEventListener('click', ()=>{ newCatFormState.color = el.dataset.newcatColor; rerender(); }));
  const submitNewCat = app.querySelector('[data-submit-newcat]');
  if(submitNewCat) submitNewCat.addEventListener('click', ()=>{
    const label = document.getElementById('newCatLabel').value.trim();
    if(!label) return;
    if(newCatFormState.editingId){
      const editId = newCatFormState.editingId;
      state.categoryModalOpen = false;
      mutateData(d=>{
        const cat = d.customCategories.find(c=>c.id===editId);
        if(cat){ cat.label=label; cat.color=newCatFormState.color; cat.type=newCatFormState.type; }
      });
      showToast('Catégorie modifiée');
      return;
    }
    const cat = { id:uid(), label, color:newCatFormState.color, type:newCatFormState.type };
    state.categoryModalOpen = false;
    mutateData(d=>{ d.customCategories.push(cat); });
    if(state.modal==='addTx' && txFormState.type===cat.type){ txFormState.category = cat.id; }
    showToast('Catégorie créée');
  });

  app.querySelectorAll('[data-open-managecat]').forEach(el=>el.addEventListener('click', ()=>{ state.manageCatOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-managecat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.manageCatOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-managecat]').forEach(el=>el.addEventListener('click', ()=>{ state.manageCatOpen=false; rerender(); }));
  app.querySelectorAll('[data-del-cat]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.customCategories = d.customCategories.filter(c=>c.id!==el.dataset.delCat); }); }));

  app.querySelectorAll('[data-open-recurmodal]').forEach(el=>el.addEventListener('click', ()=>{ state.recurringModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-recurmodal]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.recurringModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-recurmodal]').forEach(el=>el.addEventListener('click', ()=>{ state.recurringModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-del-recur]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.recurring = d.recurring.filter(r=>r.id!==el.dataset.delRecur); }); }));

  app.querySelectorAll('[data-toast-undo]').forEach(el=>el.addEventListener('click', ()=>{
    const undo = state.toast && state.toast.undo;
    state.toast = null;
    if(undo) undo();
    else rerender();
  }));

  const balEl = document.getElementById('balanceNum');
  if(balEl){
    const today0 = new Date();
    const f0 = computeForecast();
    const target0 = balanceForViewedMonth(f0, state.viewY, state.viewM);
    animateBalance(balEl, target0);
  }

  const pageEl = app.querySelector('.page');
  if(pageEl){
    let sx=null, sy=null, sInScroll=false;
    pageEl.addEventListener('touchstart', (e)=>{
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      sInScroll = !!e.target.closest('.trend-scroll');
    }, {passive:true});
    pageEl.addEventListener('touchend', (e)=>{
      if(sx===null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      const wasInScroll = sInScroll;
      sx = null; sInScroll = false;
      if(wasInScroll) return;
      if(Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)*1.6){
        const order = ['dashboard','transactions','budgets','goals'];
        const idx = order.indexOf(state.tab);
        let next = idx;
        if(dx < 0 && idx < order.length-1) next = idx+1;
        if(dx > 0 && idx > 0) next = idx-1;
        if(next !== idx){ setState({tab: order[next]}); window.scrollTo(0,0); }
      }
    }, {passive:true});
  }
  const trendScroll = app.querySelector('.trend-scroll');
  if(trendScroll){ trendScroll.scrollLeft = trendScroll.scrollWidth; }
}

function animateBalance(el, target){
  if(state.balanceAnim.raf) cancelAnimationFrame(state.balanceAnim.raf);
  const from = state.balanceAnim.display;
  const start = performance.now();
  const duration = 650;
  function step(ts){
    const p = Math.min(1, (ts-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (target-from)*eased;
    state.balanceAnim.display = val;
    el.textContent = fmt0(val);
    if(p<1){ state.balanceAnim.raf = requestAnimationFrame(step); }
    else { state.balanceAnim.target = target; }
  }
  state.balanceAnim.raf = requestAnimationFrame(step);
}

rerender();
</script>
