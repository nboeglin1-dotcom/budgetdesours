<style>
  :root{
    color-scheme: dark;
    --ink:#0E1626;
    --bg:#0E1626; --surface:#151F35; --surfaceHi:#1C2A47;
    --line:#2B3B5C; --lineSoft:#1E2C48;
    --paper:#F2EDDE; --paperDim:#96A0BC;
    --gold:#D4A94F; --coral:#E8664D; --sage:#6FA287;
    --violet:#8B7FD6; --teal:#5FB4C4; --rose:#D6829F; --slate:#7C89A6; --amber:#C97B3F; --mint:#4FBF8B;
  }
  input:not([type="checkbox"]), .field-input, .budget-limit-edit input, .goal-form input, .search-wrap input{
    -webkit-appearance:none; appearance:none; color-scheme: dark;
  }
  input[type="checkbox"]{ -webkit-appearance:auto; appearance:auto; color-scheme: dark; }
  input::-webkit-date-and-time-value{ text-align:left; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--paper); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .ledger{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  button{cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; touch-action:manipulation;}
  button:active{transform:scale(0.96); transition:transform .08s ease;}
  .tabbar button:active, .cat-opt:active, .color-swatch:active{transform:scale(0.92);}
  a, input, .card, .txrow{touch-action:manipulation;}
  input{font-family:inherit; font-size:inherit; color:inherit;}
  input:focus, button:focus{outline:none;}
  ::selection{background:var(--gold); color:var(--ink);}
  #app{max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .page{animation:pageIn .22s ease both;}
  @keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .scroll-cats, .modal-sheet{-webkit-overflow-scrolling:touch;}
  .header{position:sticky; top:0; z-index:20; background:var(--bg); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;}
  .month-nav-sticky{position:sticky; top:var(--header-h, 76px); z-index:15; background:var(--bg); padding:14px 0 4px; margin-bottom:10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--gold); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;}
  .brand-name{font-size:17px; font-weight:600; line-height:1; color:var(--paper) !important;}

/* ---------------- data model ---------------- */
const COLORS = { gold:'#D4A94F', coral:'#E8664D', sage:'#6FA287', violet:'#8B7FD6', teal:'#5FB4C4', rose:'#D6829F', slate:'#7C89A6', amber:'#C97B3F', mint:'#4FBF8B' };

const THEMES = {
  ledger: {
    name: 'Grand livre',
    bg:'var(--ink)', surface:'#151F35', surfaceHi:'#1C2A47', line:'#2B3B5C', lineSoft:'#1E2C48',
    paper:'#F2EDDE', paperDim:'#96A0BC', gold:'#D4A94F', mint:'#4FBF8B', scheme:'dark',
  },
  light: {
    name: 'Clair',
    bg:'#F7F5F0', surface:'#FFFFFF', surfaceHi:'#F0EDE6', line:'#E2DED4', lineSoft:'#EDEAE2',
    paper:'#1A1A2E', paperDim:'#75758A', gold:'#C48A2E', mint:'#2E9E71', scheme:'light',
  },
};

function applyTheme(name){
  const t = THEMES[name] || THEMES.ledger;
  const root = document.documentElement.style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--surface', t.surface);
  root.setProperty('--surfaceHi', t.surfaceHi);
  root.setProperty('--line', t.line);
  root.setProperty('--lineSoft', t.lineSoft);
  root.setProperty('--paper', t.paper);
  root.setProperty('--paperDim', t.paperDim);
  root.setProperty('--gold', t.gold);
  root.setProperty('--mint', t.mint);
  root.setProperty('color-scheme', t.scheme || 'dark');
  const metaScheme = document.querySelector('meta[name="color-scheme"]');
  if(metaScheme) metaScheme.setAttribute('content', t.scheme || 'dark');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', t.bg==='var(--ink)' ? '#0E1626' : t.bg);
}

const EXPENSE_CATS = [
  {id:'alimentation', label:'Alimentation', color:COLORS.coral, type:'expense'},
  {id:'logement', label:'Logement', color:COLORS.gold, type:'expense'},
  {id:'transport', label:'Transport', color:COLORS.sage, type:'expense'},
  {id:'loisirs', label:'Loisirs', color:COLORS.violet, type:'expense'},
  {id:'sante', label:'Santé', color:COLORS.teal, type:'expense'},
  {id:'shopping', label:'Shopping', color:COLORS.rose, type:'expense'},
  {id:'abonnements', label:'Abonnements', color:COLORS.amber, type:'expense'},
  {id:'epargne', label:'Dépôt sur épargne', color:COLORS.mint, type:'expense'},
  {id:'virement', label:'Virement entre comptes', color:COLORS.slate, type:'expense'},
  {id:'autres_d', label:'Autres', color:COLORS.slate, type:'expense'},
];
const INCOME_CATS = [
  {id:'salaire', label:'Salaire', color:COLORS.gold, type:'income'},
  {id:'freelance', label:'Freelance', color:COLORS.sage, type:'income'},
  {id:'epargne_retour', label:"Retrait d'épargne", color:COLORS.mint, type:'income'},
  {id:'virement_retour', label:'Virement entre comptes', color:COLORS.slate, type:'income'},
  {id:'autres_i', label:'Autres', color:COLORS.slate, type:'income'},
];
const ALL_CATS = [...EXPENSE_CATS, ...INCOME_CATS];

function catInfo(id){
  const custom = (state.data.customCategories||[]).find(c=>c.id===id);
  if(custom) return custom;
  const base = ALL_CATS.find(c=>c.id===id) || EXPENSE_CATS[7];
  const override = (state.data.categoryColorOverrides||{})[id];
  return override ? { ...base, color: override } : base;
}
function catsForType(type){
  const custom = (state.data.customCategories||[]).filter(c=>c.type===type);
  const base = (type==='expense'?EXPENSE_CATS:INCOME_CATS).map(c=>{
    const override = (state.data.categoryColorOverrides||{})[c.id];
    return override ? { ...c, color: override } : c;
  });
  return [...base, ...custom];
}
function findCategoryIdByLabel(label, type){
  const found = catsForType(type).find(c => c.label.toLowerCase() === label.toLowerCase());
  return found ? found.id : null;
}
function freqLabel(f){ return {weekly:'Chaque semaine', monthly:'Chaque mois', yearly:'Chaque année'}[f] || f; }
function addPeriod(date, freq){
  const d = new Date(date);
  if(freq==='weekly') d.setUTCDate(d.getUTCDate()+7);
  else if(freq==='yearly') d.setUTCFullYear(d.getUTCFullYear()+1);
  else d.setUTCMonth(d.getUTCMonth()+1);
  return d;
}
function occurrencesPerMonth(freq){
  if(freq==='weekly') return 52/12;
  if(freq==='yearly') return 1/12;
  return 1;
}
function recurringOccurrencesInMonth(y, m){
  let income = 0, expense = 0;
  (state.data.recurring||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while((next.getFullYear() < y || (next.getFullYear()===y && next.getMonth() < m)) && guard < 800){
      next = addPeriod(next, rule.frequency);
      guard++;
    }
    while(next.getFullYear()===y && next.getMonth()===m && guard<900){
      if(rule.type==='income') income += rule.amount; else expense += rule.amount;
      next = addPeriod(next, rule.frequency);
      guard++;
    }
  });
  (state.data.goalTransfers||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while((next.getFullYear() < y || (next.getFullYear()===y && next.getMonth() < m)) && guard < 800){
      next = addPeriod(next, rule.frequency);
      guard++;
    }
    while(next.getFullYear()===y && next.getMonth()===m && guard<900){
      expense += rule.amount;
      next = addPeriod(next, rule.frequency);
      guard++;
    }
  });
  return { income, expense };
}
function recurringPreviewForMonth(y, m){
  const entries = [];
  (state.data.recurring||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while((next.getFullYear() < y || (next.getFullYear()===y && next.getMonth() < m)) && guard < 800){
      next = addPeriod(next, rule.frequency);
      guard++;
    }
    while(next.getFullYear()===y && next.getMonth()===m && guard<900){
      entries.push({ id:'preview-'+rule.id+'-'+next.getTime(), type:rule.type, amount:rule.amount, category:rule.category, note:rule.note, date:next.toISOString(), isPending:true, ruleId:rule.id });
      next = addPeriod(next, rule.frequency);
      guard++;
    }
  });
  (state.data.goalTransfers||[]).forEach(rule=>{
    const goal = (state.data.goals||[]).find(g=>g.id===rule.goalId);
    let next = new Date(rule.nextDate);
    let guard = 0;
    while((next.getFullYear() < y || (next.getFullYear()===y && next.getMonth() < m)) && guard < 800){
      next = addPeriod(next, rule.frequency);
      guard++;
    }
    while(next.getFullYear()===y && next.getMonth()===m && guard<900){
      entries.push({ id:'preview-goal-'+rule.id+'-'+next.getTime(), type:'expense', amount:rule.amount, category:'epargne', note:`Virement auto vers "${goal?goal.name:'objectif'}"`, date:next.toISOString(), isPending:true, ruleId:rule.id });
      next = addPeriod(next, rule.frequency);
      guard++;
    }
  });
  return entries;
}
function upcomingRecurring(days){
  const now = new Date();
  const cutoff = new Date(now.getTime() + days*86400000);
  return (state.data.recurring||[])
    .map(r=>({ ...r, next: new Date(r.nextDate) }))
    .filter(r=> r.next >= now && r.next <= cutoff)
    .sort((a,b)=> a.next - b.next)
    .map(r=>({ ...r, daysUntil: Math.ceil((r.next - now) / 86400000) }));
}

function processRecurring(){
  const today = new Date();
  let changed = false;
  (state.data.recurring||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while(next <= today && guard < 1000){
      state.data.transactions.unshift({ id: uid(), type: rule.type, amount: rule.amount, category: rule.category, note: rule.note, date: next.toISOString(), recurringId: rule.id });
      next = addPeriod(next, rule.frequency);

  });
  if(changed) saveData(state.data);
}
function processCategoryRollover(){
  const today = new Date();
  const curKey = today.getFullYear() + '-' + today.getMonth();
  if(!state.data.lastRolloverCheck){
    state.data.lastRolloverCheck = curKey;
    saveData(state.data);
    return;
  }
  if(state.data.lastRolloverCheck === curKey) return;
  const parts = state.data.lastRolloverCheck.split('-').map(Number);
  let y = parts[0], m = parts[1];
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));
  let guard = 0;
  while((y*12+m) < (today.getFullYear()*12+today.getMonth()) && guard < 36){
    const byCat = {};
    state.data.transactions.forEach(t=>{
      if(t.type!=='expense') return;
      const d = new Date(t.date);
      if(d.getFullYear()===y && d.getMonth()===m) byCat[t.category] = (byCat[t.category]||0) + t.amount;
    });
    catsForType('expense').forEach(cat=>{
      if(recurringCatIds.has(cat.id)) return;
      const limit = state.data.budgets[cat.id] || 0;
      if(limit<=0) return;
      const spent = byCat[cat.id] || 0;
      const surplus = Math.max(0, limit - spent);
      if(surplus>0){
        state.data.categoryRollover[cat.id] = Math.round(((state.data.categoryRollover[cat.id]||0) + surplus) * 100) / 100;
      }
    });
    m++; if(m>11){ m=0; y++; }
    guard++;
  }
  state.data.lastRolloverCheck = curKey;
  saveData(state.data);
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.slice(0, text.indexOf('\n')>-1 ? text.indexOf('\n') : text.length);
  const delim = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delim){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field = '';
        if(row.some(f=>f.trim()!=='')) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); if(row.some(f=>f.trim()!=='')) rows.push(row); }
  return rows;
}
function parseFrenchAmount(str){
  if(str===undefined || str===null) return NaN;
  let s = String(str).trim().replace(/\s|\u00a0/g,'').replace(/[€$]/g,'');
  const hasComma = s.includes(','), hasDot = s.includes('.');
  if(hasComma && hasDot){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(hasComma){ s = s.replace(',', '.'); }
  return parseFloat(s);
}
function waitForPdfJs(timeoutMs){
  return new Promise((resolve, reject)=>{
    if(window.pdfjsLib) return resolve();
    const start = Date.now();
    const iv = setInterval(()=>{
      if(window.pdfjsLib){ clearInterval(iv); resolve(); }
      else if(Date.now()-start > timeoutMs){ clearInterval(iv); reject(new Error('pdfjs-non-charge')); }
    }, 150);

async function extractPdfLines(arrayBuffer){
  await waitForPdfJs(8000);
  if(pdfjsLib.GlobalWorkerOptions && !pdfjsLib.GlobalWorkerOptions.workerSrc){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
  const pdf = await Promise.race([
    loadingTask.promise,
    new Promise((_,rej)=> setTimeout(()=>rej(new Error('pdf-timeout')), 20000)),
  ]);
  const lines = [];
  const pages = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let currentY = null, currentLine = [];
    const pageLines = [];
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(currentY === null) currentY = y;
      if(Math.abs(y - currentY) > 3){
        if(currentLine.length) pageLines.push(currentLine.join(' ').replace(/\s+/g,' ').trim());
        currentLine = [];
        currentY = y;
      }
      currentLine.push(item.str);
    });
    if(currentLine.length) pageLines.push(currentLine.join(' ').replace(/\s+/g,' ').trim());
    const filtered = pageLines.filter(l=>l.length>0);
    pages.push(filtered);
    lines.push(...filtered);
  }
  lines.__pages = pages;
  return lines;
}
function parseFlexibleDate(str, format){
  if(!str) return null;
  const s = String(str).trim();
  let m;
  if(format==='iso' && (m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))){
    return new Date(+m[1], +m[2]-1, +m[3]);
  }
  if(m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)){
    return new Date(+m[3], +m[2]-1, +m[1]);
  }
  if(m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)){
    return new Date(+m[1], +m[2]-1, +m[3]);
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function parsePdfTransactionLines(lines){
  const dateRe = /(\d{1,2}[\/.]\d{1,2}[\/.](?:\d{4}|\d{2}))/;
  const amountRe = /([+-]?\d{1,3}(?:[.\s\u00a0]?\d{3})*[.,]\d{2})\s*€?/g;
  const incomeKeywords = ['virement recu','vir recu','vir de','salaire','remboursement','remb ','credit ','versement','ref reçu','virement reçu'];
  const rows = [];
  lines.forEach(line=>{
    const dm = line.match(dateRe);
    if(!dm || dm.index > 20) return;
    const amountMatches = [...line.matchAll(amountRe)];
    const relevant = amountMatches.filter(m => m.index >= dm.index + dm[0].length);
    if(relevant.length===0) return;
    const am = relevant[0];
    let dateStr = dm[1];
    if(/\d{1,2}[\/.]\d{1,2}[\/.]\d{2}$/.test(dateStr)){
      dateStr = dateStr.replace(/(\d{2})$/, (yy)=>{ const n=+yy; return n<70 ? '20'+yy : '19'+yy; });
    }
    const before = line.slice(0, dm.index);
    const between = line.slice(dm.index + dm[0].length, am.index);
    const after = line.slice(am.index + am[0].length);
    let label = (before + ' ' + between + ' ' + after).replace(/\s+/g,' ').trim();
    label = label.replace(/^[\s:\-–.,]+|[\s:\-–.,]+$/g,'');
    label = label.replace(/^\d{1,2}[\/.]\d{1,2}[\/.](?:\d{4}|\d{2})\s*/, '').trim();
    label = label.replace(/[+-]?\d{1,3}(?:[.\s\u00a0]?\d{3})*[.,]\d{2}\s*€?\s*$/, '').trim();
    let amountStr = am[1].trim();
    const explicitSign = amountStr.startsWith('-') ? -1 : (amountStr.startsWith('+') ? 1 : null);
    const cleanAmount = amountStr.replace(/^[+-]/,'').trim();
    const labelLower = label.toLowerCase();
    const looksLikeIncome = incomeKeywords.some(k=>labelLower.includes(k));
    const sign = explicitSign !== null ? explicitSign : (looksLikeIncome ? 1 : -1);
    rows.push([dateStr, label || '(sans libellé)', (sign<0?'-':'') + cleanAmount]);
  });
  return rows;
}

    const labels = pageLines.filter(l=>{
      const t = l.trim();
      return primaryPrefixes.test(t) && !summaryPrefixes.test(t);
    });
    const numerics = [];
    pageLines.forEach(l=>{
      const t = l.trim();
      if(summaryPrefixes.test(t)) return;
      const m = t.match(numericRowRe);
      if(m) numerics.push(m);
    });
    const n = Math.min(labels.length, numerics.length);
    for(let i=0;i<n;i++){
      const label = labels[i].trim();
      const m = numerics[i];
      let yy = m[5];
      if(yy.length===2){ const num=+yy; yy = (num<70?2000+num:1900+num)+''; }
      const dateStr = `${m[3]}/${m[4]}/${yy}`;
      const amountStr = m[6].trim();
      const labelLower = label.toLowerCase();
      const looksLikeIncome = incomeKeywords.some(k=>labelLower.includes(k))
        || (/^virement\s/i.test(label) && !/sepa/i.test(label) && !/\bou\b/i.test(label));
      const sign = looksLikeIncome ? 1 : -1;
      rows.push([dateStr, label, (sign<0?'-':'') + amountStr]);
    }
  });
  return rows;
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function unlockApp(){
  state.locked = false;
  state.pinInput = '';
  state.pinError = false;
  rerender();
}

function handlePinDigit(d){
  if(state.pinInput.length>=4) return;
  state.pinInput += d;
  if(state.pinInput.length===4){
    if(state.pinInput === state.data.security.pin){
      unlockApp();
    } else {
      state.pinError = true;
      rerender();
      setTimeout(()=>{ state.pinInput=''; state.pinError=false; rerender(); }, 550);
    }
  } else {
    rerender();
  }
}

function handleSetupDigit(d){
  if(state.pinSetupStep!=='confirm'){
    if(state.pinSetupFirst.length>=4) return;
    state.pinSetupFirst += d;
    if(state.pinSetupFirst.length===4){ state.pinSetupStep='confirm'; state.pinConfirm=''; }
    rerender();
  } else {
    if(state.pinConfirm.length>=4) return;
    state.pinConfirm += d;
    if(state.pinConfirm.length===4){
      if(state.pinConfirm === state.pinSetupFirst){
        mutateData(d=>{ d.security.enabled = true; d.security.pin = state.pinSetupFirst; });
        state.pinSetupStep = null; state.pinSetupFirst=''; state.pinConfirm='';
        showToast('Verrouillage activé');
      } else {
        state.pinSetupStep = null; state.pinSetupFirst=''; state.pinConfirm='';
        showToast('Les codes ne correspondent pas, réessayez');
      }
    } else {
      rerender();
    }
  }
}
function handleSetupBackspace(){
  if(state.pinSetupStep==='confirm'){ state.pinConfirm = state.pinConfirm.slice(0,-1); }
  else { state.pinSetupFirst = state.pinSetupFirst.slice(0,-1); }
  rerender();
}

async function registerBiometric(){
  if(!window.PublicKeyCredential){ showToast('Face ID / Touch ID indisponible sur cet appareil'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge, rp: { name: 'Solde' }, user: { id: userId, name: 'solde-user', displayName: 'Solde' },
        pubKeyCredParams: [{ alg:-7, type:'public-key' }, { alg:-257, type:'public-key' }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
      }
    });
    if(cred){
      const credId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
      mutateData(d=>{ d.security.useBiometric = true; d.security.credentialId = credId; });
      showToast('Face ID / Touch ID activé');
    }
  }catch(e){ showToast("Impossible d'activer Face ID / Touch ID"); }
}

async function tryBiometricUnlock(){
  const sec = state.data.security;
  if(!sec || !sec.credentialId || !window.PublicKeyCredential) return;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const idBytes = Uint8Array.from(atob(sec.credentialId), c=>c.charCodeAt(0));
    const assertion = await navigator.credentials.get({
      publicKey: { challenge, allowCredentials: [{ id: idBytes, type: 'public-key' }], userVerification: 'required', timeout: 60000 }
    });
    if(assertion) unlockApp();
  }catch(e){ /* annulé ou échoué : l'utilisateur peut saisir son code */ }
}

function accountTransfer(fromId, toId, amt, note, date){
  const from = state.data.accounts.find(a=>a.id===fromId);
  const to = state.data.accounts.find(a=>a.id===toId);
  if(!from || !to || fromId===toId || !amt || amt<=0) return false;
  const linkId = uid();
  const isoDate = date ? new Date(date).toISOString() : new Date().toISOString();
  mutateData(d=>{
    d.transactions.unshift({ id:uid(), type:'expense', amount:amt, category:'virement', note: note || `Vers ${to.name}`, date:isoDate, accountId:fromId, transferId:linkId });
    d.transactions.unshift({ id:uid(), type:'income', amount:amt, category:'virement_retour', note: note || `Depuis ${from.name}`, date:isoDate, accountId:toId, transferId:linkId });
  });
  showToast(`${fmt0(amt)} viré de ${from.name} vers ${to.name}`);
  return true;
}
function goalContribute(id, amt){
  let goalName = '';
  mutateData(d=>{
    const g=d.goals.find(g=>g.id===id);
    if(g){
      goalName = g.name;
      g.current = Math.max(0,g.current+amt);
      d.transactions.unshift({ id:uid(), type:'expense', amount:amt, category:'epargne', note:`Vers "${g.name}"`, date:new Date().toISOString(), accountId: g.accountId||'main', goalId: g.id });
    }
  });
  showToast(`+${fmt0(amt)} vers ${goalName || "l'objectif"} — déduit du solde`);
}
function goalWithdraw(id, amt){
  let goalName = '';
  mutateData(d=>{
    const g=d.goals.find(g=>g.id===id);
    if(g){
      goalName = g.name;
      g.current = Math.max(0,g.current-amt);
      d.transactions.unshift({ id:uid(), type:'income', amount:amt, category:'epargne_retour', note:`Retrait de "${g.name}"`, date:new Date().toISOString(), accountId: g.accountId||'main', goalId: g.id });
    }
  });
  showToast(`${fmt0(amt)} retirés de ${goalName || "l'objectif"} — ajoutés au solde`);
}
function defaultTxDate(){
  const today = new Date();
  if(state.viewY===today.getFullYear() && state.viewM===today.getMonth()){
    return today.toISOString().slice(0,10);
  }
  const daysInMonth = new Date(state.viewY, state.viewM+1, 0).getDate();
  const day = Math.min(today.getDate(), daysInMonth);
  return new Date(state.viewY, state.viewM, day).toISOString().slice(0,10);
}
function openEditTx(id){
  const t = state.data.transactions.find(t=>t.id===id);
  if(!t) return;
  const linkedRule = t.recurringId ? (state.data.recurring||[]).find(r=>r.id===t.recurringId) : null;
  txFormState = { type:t.type, category:t.category, date:new Date(t.date).toISOString().slice(0,10), recurring:!!linkedRule, frequency:linkedRule?linkedRule.frequency:'monthly', note:t.note||'', amount:t.amount, editingId:t.id, photo:t.photo||null, accountId:t.accountId||'main' };
  state.txAdvancedOpen = true;
  setState({modal:'addTx'});
}

function rerender(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const scrollY = window.scrollY;
  const modalSheets = document.querySelectorAll('.modal-sheet');
  const modalScrollTop = modalSheets.length ? modalSheets[modalSheets.length-1].scrollTop : null;
  const modalWasOpen = modalSheets.length > 0;
  document.getElementById('app').innerHTML = renderApp();
  bindEvents();
  if(modalWasOpen){
    document.querySelectorAll('.modal-sheet').forEach(el=>{ el.style.animation = 'none'; });
  }
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  } else { window.scrollTo(0, scrollY); }
  if(modalScrollTop !== null){
    const newSheets = document.querySelectorAll('.modal-sheet');
    if(newSheets.length) newSheets[newSheets.length-1].scrollTop = modalScrollTop;
  }
}

function accountBalance(accountId){
  const now = new Date();
  return state.data.transactions
    .filter(t=>(t.accountId||'main')===accountId && new Date(t.date) <= now)
    .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
}

function computeCsvImportRows(){
  const st = state.csvImport;
  if(!st) return [];
  const { headers, rows, mapping, mode, dateFormat } = st;
  const dateIdx = headers.indexOf(mapping.date);
  const labelIdx = headers.indexOf(mapping.label);
  const amountIdx = headers.indexOf(mapping.amount);
  const debitIdx = headers.indexOf(mapping.debit);
  const creditIdx = headers.indexOf(mapping.credit);
  return rows.map(r=>{
    const date = parseFlexibleDate(r[dateIdx], dateFormat);
    const label = labelIdx>=0 ? (r[labelIdx]||'').trim() : '';
    let amount;
    if(mode==='single'){
      amount = parseFrenchAmount(r[amountIdx]);
    } else {
      const d = parseFrenchAmount(r[debitIdx]);
      const c = parseFrenchAmount(r[creditIdx]);
      amount = (!isNaN(c) && c!==0) ? c : (!isNaN(d) && d!==0 ? -d : NaN);
    }
    const valid = date && !isNaN(amount) && amount!==0;
    return { date, label, amount, type: amount>=0 ? 'income' : 'expense', valid };
  });
}

/* ---------------- Dashboard ---------------- */
function getReviewRange(){
  const period = state.reviewPeriod;
  if(period==='quarter'){
    const y = state.reviewYear;
    const q = state.reviewQuarter;
    const startM = (q-1)*3;
    return { start: new Date(y, startM, 1), end: new Date(y, startM+3, 0, 23,59,59), label: `T${q} ${y}` };
  }
  if(period==='custom'){
    const start = state.reviewCustomStart ? new Date(state.reviewCustomStart+'T00:00:00') : new Date(state.reviewYear,0,1);
    const end = state.reviewCustomEnd ? new Date(state.reviewCustomEnd+'T23:59:59') : new Date();
    return { start, end, label: `${start.toLocaleDateString('fr-FR')} → ${end.toLocaleDateString('fr-FR')}` };
  }
  const y = state.reviewYear;
  return { start: new Date(y,0,1), end: new Date(y,11,31,23,59,59), label: String(y) };
}

function computeReviewStats(range){
  const TRANSFER_CATS = new Set(['epargne','epargne_retour','virement','virement_retour']);
  const txs = visibleTransactions().filter(t=>{
    const d = new Date(t.date);
    return d >= range.start && d <= range.end;
  });
  const income = txs.filter(t=>t.type==='income' && !TRANSFER_CATS.has(t.category)).reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='expense' && !TRANSFER_CATS.has(t.category)).reduce((s,t)=>s+t.amount,0);
  const savedToGoals = txs.filter(t=>t.type==='expense' && t.category==='epargne').reduce((s,t)=>s+t.amount,0);
  const withdrawnFromGoals = txs.filter(t=>t.type==='income' && t.category==='epargne_retour').reduce((s,t)=>s+t.amount,0);
  const netSavedToGoals = savedToGoals - withdrawnFromGoals;
  const net = income - expense;
  const rate = income>0 ? Math.max(0, Math.round(net/income*100)) : 0;

  const byCat = {};
  txs.filter(t=>t.type==='expense' && !TRANSFER_CATS.has(t.category)).forEach(t=>{ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const catData = Object.entries(byCat).map(([id,value])=>({ id, value, ...catInfo(id) })).sort((a,b)=>b.value-a.value);

  const months = [];
  const spansYears = range.start.getFullYear() !== range.end.getFullYear();
  let cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
  const endCursor = new Date(range.end.getFullYear(), range.end.getMonth(), 1);
  let guard = 0;
  while(cursor <= endCursor && guard < 36){
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const mtx = txs.filter(t=>{ const d=new Date(t.date); return d.getFullYear()===y && d.getMonth()===m; });
    const inc = mtx.filter(t=>t.type==='income' && !TRANSFER_CATS.has(t.category)).reduce((s,t)=>s+t.amount,0);
    const exp = mtx.filter(t=>t.type==='expense' && !TRANSFER_CATS.has(t.category)).reduce((s,t)=>s+t.amount,0);
    months.push({ y, m, label: MONTHS_SHORT[m] + (spansYears ? ` ${String(y).slice(2)}` : ''), income:inc, expense:exp, net: inc-exp, hasData: mtx.length>0 });
    cursor.setMonth(cursor.getMonth()+1);
    guard++;
  }
  const withData = months.filter(mo=>mo.hasData);
  const best = withData.length ? withData.reduce((a,b)=> b.net>a.net ? b : a) : null;
  const worst = withData.length ? withData.reduce((a,b)=> b.net<a.net ? b : a) : null;
  const monthsCount = Math.max(1, withData.length);
  const avgNet = net / monthsCount;

  return { income, expense, net, rate, catData, months, best, worst, hasData: txs.length>0, netSavedToGoals, avgNet, monthsCount };
}

function habitProjections(amount, frequency){
  let perMonth;
  if(frequency==='daily') perMonth = amount * 30.44;
  else if(frequency==='weekly') perMonth = amount * 4.348;
  else perMonth = amount;
  return { perMonth, perYear: perMonth*12, per5y: perMonth*60 };
}

function computeHealthScore(){
  const f = computeForecast();
  const bal = totalBalance();
  const criteria = [];

  // 1. Taux d'épargne (25 pts) — 20% de taux = score plein
  const rate = f.avgIncome>0 ? Math.max(0, (f.avgIncome-f.avgExpense)/f.avgIncome*100) : 0;
  const s1 = f.avgIncome>0 ? Math.min(25, Math.round(rate/20*25)) : 0;
  criteria.push({ label:'Taux d\'épargne', score:s1, max:25, detail:`${Math.round(rate)}% en moyenne sur 3 mois` });

  // 2. Fonds d'urgence (25 pts) — 6 mois de dépenses = score plein
  const monthsCovered = f.avgExpense>0 ? bal/f.avgExpense : 0;
  const s2 = f.avgExpense>0 ? Math.min(25, Math.round(monthsCovered/6*25)) : 0;
  criteria.push({ label:"Fonds d'urgence", score:s2, max:25, detail:`${monthsCovered.toFixed(1)} mois de dépenses couverts` });

  // 3. Rigidité budgétaire (20 pts) — moins de charges fixes = mieux
  const recurringExpensePerMonth = (state.data.recurring||[]).filter(r=>r.type==='expense').reduce((s,r)=> s + r.amount*occurrencesPerMonth(r.frequency), 0);
  const rigidity = f.avgIncome>0 ? recurringExpensePerMonth/f.avgIncome*100 : 0;
  const s3 = f.avgIncome>0 ? Math.max(0, Math.round(20*(1-Math.min(100,rigidity)/100))) : 10;
  criteria.push({ label:'Souplesse budgétaire', score:s3, max:20, detail:`${Math.round(rigidity)}% de revenus en charges fixes` });

  // 4. Respect du budget (15 pts) — basé sur la jauge du mois en cours
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));
  const nonRecurringCats = catsForType('expense').filter(c=>!recurringCatIds.has(c.id) && c.id!=='epargne' && c.id!=='virement');
  const byCat = {};
  monthTx().filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const globalLimit = nonRecurringCats.reduce((s,c)=> s + effectiveLimit(c.id), 0);
  const globalSpentNow = nonRecurringCats.reduce((s,c)=> s + (byCat[c.id]||0), 0);
  const globalPctNow = globalLimit>0 ? globalSpentNow/globalLimit*100 : null;
  const s4 = globalPctNow===null ? 8 : Math.max(0, Math.round(15 - Math.max(0,globalPctNow-100)/10*15));
  criteria.push({ label:'Respect du budget', score:s4, max:15, detail: globalPctNow===null ? 'Pas encore de budget défini' : `${Math.round(globalPctNow)}% des enveloppes utilisées` });

  // 5. Régularité de l'épargne (15 pts) — mois avec épargne nette positive sur les 3 derniers
  let positiveMonths = 0;
  const today = new Date();
  for(let i=0;i<3;i++){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){ m+=12; y--; }
    const mtx = visibleTransactions().filter(t=>sameMonth(t.date,y,m) && t.category!=='epargne' && t.category!=='epargne_retour' && t.category!=='virement' && t.category!=='virement_retour');
    const inc = mtx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const exp = mtx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    if(inc>exp && inc>0) positiveMonths++;
  }
  const s5 = Math.round(positiveMonths/3*15);
  criteria.push({ label:'Régularité', score:s5, max:15, detail:`${positiveMonths}/3 derniers mois excédentaires` });

  const total = criteria.reduce((s,c)=>s+c.score,0);
  return { total, criteria };
}
function recordHealthScoreSnapshot(){
  try{
    const today = new Date();
    const monthKey = today.getFullYear() + '-' + today.getMonth();
    const hist = state.data.healthScoreHistory || [];
    if(hist.length && hist[hist.length-1].monthKey===monthKey) return;
    const { total } = computeHealthScore();
    hist.push({ monthKey, score: total });
    while(hist.length > 12) hist.shift();
    state.data.healthScoreHistory = hist;
    saveData(state.data);
  }catch(e){}
}

function computeInsights(){
  const f = computeForecast();
  const insights = [];
  const bal = totalBalance();

  if(bal < 0){
    insights.push({ icon:'alert', tone:'warning', title:'Solde négatif', text:`Ton solde actuel est de ${fmt0(bal)}. C'est le point à traiter en priorité avant toute autre chose.` });
  }

  if(f.avgExpense > 0){
    const monthsCovered = bal / f.avgExpense;
    let tone, text;
    if(monthsCovered < 1){ tone='warning'; text=`Ton solde couvre environ ${monthsCovered.toFixed(1)} mois de dépenses. La référence généralement citée pour un fonds d'urgence est de 3 à 6 mois de dépenses courantes, sur un support liquide (Livret A, LDDS).`; }
    else if(monthsCovered < 3){ tone='neutral'; text=`Ton solde couvre environ ${monthsCovered.toFixed(1)} mois de dépenses — en construction vers le repère habituel de 3 à 6 mois.`; }
    else if(monthsCovered < 6){ tone='positive'; text=`Ton solde couvre environ ${monthsCovered.toFixed(1)} mois de dépenses, dans la fourchette généralement recommandée (3 à 6 mois) pour un fonds d'urgence.`; }
    else { tone='positive'; text=`Ton solde couvre plus de 6 mois de dépenses. Le repère classique de fonds d'urgence est déjà large — une partie du surplus pourrait avoir un rôle plus actif (épargne réglementée, investissement), selon ton horizon et ta tolérance au risque.`; }
    insights.push({ icon:'shield', tone, title:'Fonds d\'urgence', text });
  }

  if(f.avgIncome > 0){
    const rate = Math.round((f.avgIncome - f.avgExpense) / f.avgIncome * 100);
    let tone = rate>=20 ? 'positive' : (rate>=0 ? 'neutral' : 'warning');
    insights.push({ icon:'faceid', tone, title:'Taux d\'épargne moyen', text:`Sur tes 3 derniers mois, tu épargnes en moyenne ${rate}% de tes revenus (${fmt0(f.avgIncome-f.avgExpense)}/mois). Un repère souvent cité est 20%, mais ça dépend beaucoup de ta situation.` });
  }

  const recurringExpensePerMonth = (state.data.recurring||[]).filter(r=>r.type==='expense').reduce((s,r)=> s + r.amount*occurrencesPerMonth(r.frequency), 0);
  if(f.avgIncome > 0){
    const rigidity = Math.round(recurringExpensePerMonth / f.avgIncome * 100);
    if(rigidity > 0){
      const tone = rigidity>50 ? 'warning' : 'neutral';
      insights.push({ icon:'repeat', tone, title:'Charges fixes', text:`Tes transactions récurrentes représentent environ ${rigidity}% de tes revenus moyens (${fmt0(recurringExpensePerMonth)}/mois). ${rigidity>50 ? "Une part élevée de charges fixes réduit ta marge de manœuvre en cas d'imprévu." : "Ça laisse une marge de manœuvre raisonnable pour les dépenses variables."}` });
    }
  }

  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));
  const cats = catsForType('expense').filter(c=>!recurringCatIds.has(c.id) && c.id!=='epargne' && c.id!=='virement');
  let biggestRise = null;
  cats.forEach(c=>{
    const cur = monthTx().filter(t=>t.type==='expense' && t.category===c.id).reduce((s,t)=>s+t.amount,0);
    const prev = prevMonthCatSpend(c.id);
    if(prev >= 20 && cur > prev){
      const pct = Math.round((cur-prev)/prev*100);
      if(!biggestRise || pct > biggestRise.pct) biggestRise = { label:c.label, pct, cur, prev };
    }
  });
  if(biggestRise){
    insights.push({ icon:'up', tone:'neutral', title:'Catégorie en hausse', text:`"${biggestRise.label}" a augmenté de ${biggestRise.pct}% par rapport au mois dernier (${fmt0(biggestRise.prev)} → ${fmt0(biggestRise.cur)}). Pas forcément un problème, mais utile à remarquer.` });
  }

  const today = new Date();
  const insightGoals = state.activeAccountFilter ? (state.data.goals||[]).filter(g=>(g.accountId||'main')===state.activeAccountFilter) : (state.data.goals||[]);
  insightGoals.forEach(g=>{
    if(!g.deadline || g.current >= g.target) return;
    const dl = new Date(g.deadline);
    const daysLeft = Math.round((dl - today) / 86400000);
    const pct = g.target>0 ? g.current/g.target : 0;
    if(daysLeft <= 30 && pct < 0.8){
      insights.push({ icon:'alert', tone:'warning', title:`Objectif "${g.name}"`, text:`Échéance dans ${daysLeft>=0?daysLeft+' jours':'déjà dépassée'}, à ${Math.round(pct*100)}% de l'objectif (${fmt0(g.current)} / ${fmt0(g.target)}). Il manque ${fmt0(g.target-g.current)}.` });
    }
  });

  return insights;
}

function computeForecast(){
  const today = new Date();
  const months = [];
  for(let i=2;i>=0;i--){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){m+=12;y--;}
    months.push({y,m});
  }
  const TRANSFER_CATS_FC = new Set(['epargne','epargne_retour','virement','virement_retour']);
  const incomes = [], expenses = [];
  months.forEach(({y,m})=>{
    const txs = visibleTransactions().filter(t=>sameMonth(t.date,y,m) && !TRANSFER_CATS_FC.has(t.category));
    incomes.push(txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
    expenses.push(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  });
  const avgIncome = incomes.reduce((a,b)=>a+b,0)/incomes.length;
  const avgExpense = expenses.reduce((a,b)=>a+b,0)/expenses.length;
  const hasHistory = incomes.some(v=>v>0) || expenses.some(v=>v>0);
  const netAvg = avgIncome - avgExpense;

  let recurIncomePerMonth = 0, recurExpensePerMonth = 0;
  (state.data.recurring||[]).forEach(rule=>{
    const perMonth = rule.amount * occurrencesPerMonth(rule.frequency);
    if(rule.type==='income') recurIncomePerMonth += perMonth; else recurExpensePerMonth += perMonth;
  });
  const variableIncome = Math.max(0, avgIncome - recurIncomePerMonth);
  const variableExpense = Math.max(0, avgExpense - recurExpensePerMonth);

  const curMonthEnd = new Date(today.getFullYear(), today.getMonth()+1, 0, 23,59,59,999);
  const startBalance = visibleTransactions()
    .filter(t => new Date(t.date) <= curMonthEnd)
    .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
  const points = [];
  let lastValue = startBalance;
  for(let i=1;i<=24;i++){
    let m = today.getMonth()+i, y = today.getFullYear();
    while(m>11){ m-=12; y++; }
    const hasRealDataThisMonth = visibleTransactions().some(t=>sameMonth(t.date,y,m));
    let value;
    if(hasRealDataThisMonth){
      const cutoff = new Date(y, m+1, 0, 23,59,59,999);
      value = visibleTransactions()
        .filter(t => new Date(t.date) <= cutoff)
        .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
    } else {
      const rec = recurringOccurrencesInMonth(y,m);
      const monthIncome = variableIncome + rec.income;
      const monthExpense = variableExpense + rec.expense;
      value = lastValue + (monthIncome - monthExpense);
    }
    lastValue = value;
    points.push({ label: `${MONTHS_SHORT[m]} ${String(y).slice(2)}`, value, y, m });
  }
  return { points, avgIncome, avgExpense, netAvg, startBalance, hasHistory, variableIncome, variableExpense };
}

function computeCategoryForecast(targetExpense, viewY, viewM){
  const recurring = (state.data.recurring||[]).filter(r=>r.type==='expense');
  const rows = [];
  let recurringTotal = 0;
  if(recurring.length && viewY!==undefined){
    const byCategory = {};
    recurring.forEach(rule=>{
      let next = new Date(rule.nextDate);
      let guard = 0;
      while((next.getFullYear() < viewY || (next.getFullYear()===viewY && next.getMonth() < viewM)) && guard < 800){
        next = addPeriod(next, rule.frequency);
        guard++;
      }
      while(next.getFullYear()===viewY && next.getMonth()===viewM && guard<900){
        byCategory[rule.category] = (byCategory[rule.category]||0) + rule.amount;
        next = addPeriod(next, rule.frequency);
        guard++;
      }
    });
    Object.entries(byCategory).forEach(([id,value])=>{
      rows.push({ id, value, ...catInfo(id) });
      recurringTotal += value;
    });
  }
  const variableEstimate = Math.max(0, targetExpense - recurringTotal);
  if(variableEstimate > 0){
    rows.push({ id:'__estimate_variable', value: variableEstimate, label:'Estimé (variable)', color: COLORS.slate });
  }
  return rows.sort((a,b)=>b.value-a.value);
}
function computeCategoryForecastLegacy(targetExpense){
  const today = new Date();
  const months = [];
  for(let i=2;i>=0;i--){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){m+=12;y--;}
    months.push({y,m});
  }
  const totals = {};
  let grandTotal = 0;
  months.forEach(({y,m})=>{
    visibleTransactions().filter(t=>t.type==='expense' && sameMonth(t.date,y,m)).forEach(t=>{
      totals[t.category] = (totals[t.category]||0) + t.amount;
      grandTotal += t.amount;
    });
  });
  if(grandTotal <= 0) return [];
  return Object.entries(totals)
    .map(([id,sum])=>({ id, value: (sum/grandTotal)*targetExpense, ...catInfo(id) }))
    .sort((a,b)=>b.value-a.value);
}

function monthIndex(y,m){ return y*12+m; }

function balanceForViewedMonth(f, viewY, viewM){
  const today = new Date();
  const curIdx = monthIndex(today.getFullYear(), today.getMonth());
  const viewIdx = monthIndex(viewY, viewM);
  const diff = viewIdx - curIdx;
  const monthEnd = new Date(viewY, viewM+1, 0, 23,59,59,999);
  const realBalance = visibleTransactions()
    .filter(t => new Date(t.date) <= monthEnd)
    .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
  const monthTxNow = visibleTransactions().filter(t=>sameMonth(t.date, viewY, viewM));
  const hasIncomeTx = monthTxNow.some(t=>t.type==='income' && t.category!=='epargne_retour');
  const hasExpenseTx = monthTxNow.some(t=>t.type==='expense' && t.category!=='epargne');
  const hasRealDataThisMonth = monthTxNow.length > 0;
  if(diff === 0 && (!hasIncomeTx || !hasExpenseTx)){
    const prevMonthEnd = new Date(viewY, viewM, 0, 23,59,59,999);
    const prevBalance = visibleTransactions().filter(t => new Date(t.date) <= prevMonthEnd).reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
    const realIncome = monthTxNow.filter(t=>t.type==='income' && t.category!=='epargne_retour').reduce((s,t)=>s+t.amount,0);
    const realExpense = monthTxNow.filter(t=>t.type==='expense' && t.category!=='epargne').reduce((s,t)=>s+t.amount,0);
    const rec = recurringOccurrencesInMonth(viewY, viewM);
    const income = hasIncomeTx ? realIncome : (f.variableIncome + rec.income);
    const expense = hasExpenseTx ? realExpense : (f.variableExpense + rec.expense);
    return prevBalance + income - expense;
  }
  if(diff <= 0) return realBalance;
  if(hasRealDataThisMonth) return realBalance;
  if(diff <= 24) return f.points[diff-1].value;
  return f.startBalance + f.netAvg*diff;
}

function pctChange(current, previous){
  if(!previous || previous<=0) return null;
  return Math.round((current-previous)/previous*100);
}
function changeBadge(pct, goodDirection){
  if(pct===null || pct===undefined) return '';
  const isUp = pct>0;
  const isFlat = pct===0;
  const isGood = goodDirection==='up' ? isUp : !isUp;
  const color = isFlat ? 'var(--paperDim)' : (isGood ? 'var(--sage)' : 'var(--coral)');
  const arrow = isFlat ? '' : (isUp ? '↑' : '↓');
  return ` <span class="mono" style="font-size:10.5px; color:${color};">${arrow}${Math.abs(pct)}%</span>`;
}
function prevMonthCatSpend(catId){
  let m = state.viewM - 1, y = state.viewY;
  if(m<0){ m = 11; y--; }
  return visibleTransactions()
    .filter(t=>t.type==='expense' && t.category===catId && sameMonth(t.date, y, m))
    .reduce((s,t)=>s+t.amount, 0);
}
function computeMonthStats(){
  const today = new Date();
  const curIdx = monthIndex(today.getFullYear(), today.getMonth());
  const viewIdx = monthIndex(state.viewY, state.viewM);
  const isFuture = viewIdx > curIdx;

  const f = computeForecast();
  const tx = monthTx();
  const realIncome = tx.filter(t=>t.type==='income' && t.category!=='epargne_retour').reduce((s,t)=>s+t.amount,0);
  const realExpense = tx.filter(t=>t.type==='expense' && t.category!=='epargne').reduce((s,t)=>s+t.amount,0);
  const savedDeposits = tx.filter(t=>t.type==='expense' && t.category==='epargne').reduce((s,t)=>s+t.amount,0);
  const savedWithdrawals = tx.filter(t=>t.type==='income' && t.category==='epargne_retour').reduce((s,t)=>s+t.amount,0);
  const savedThisMonth = savedDeposits - savedWithdrawals;
  const isCurrentOrFuture = isFuture || viewIdx===curIdx;
  const hasIncomeTx = tx.some(t=>t.type==='income' && t.category!=='epargne_retour');
  const hasExpenseTx = tx.some(t=>t.type==='expense' && t.category!=='epargne');
  const useIncomeEstimate = isCurrentOrFuture && !hasIncomeTx;
  const useExpenseEstimate = isCurrentOrFuture && !hasExpenseTx;
  const usingEstimate = useIncomeEstimate || useExpenseEstimate;
  const recurThisMonth = usingEstimate ? recurringOccurrencesInMonth(state.viewY, state.viewM) : {income:0, expense:0};
  const income = useIncomeEstimate ? (f.variableIncome + recurThisMonth.income) : realIncome;
  const expense = useExpenseEstimate ? (f.variableExpense + recurThisMonth.expense) : realExpense;
  const savings = income - expense;
  const rate = income>0 ? Math.max(0, Math.round(savings/income*100)) : 0;
  const bal = balanceForViewedMonth(f, state.viewY, state.viewM);

  let pm = state.viewM - 1, py = state.viewY;
  if(pm<0){ pm = 11; py--; }
  const prevTx = visibleTransactions().filter(t=>sameMonth(t.date, py, pm));
  const prevIncome = prevTx.filter(t=>t.type==='income' && t.category!=='epargne_retour').reduce((s,t)=>s+t.amount,0);
  const prevExpense = prevTx.filter(t=>t.type==='expense' && t.category!=='epargne').reduce((s,t)=>s+t.amount,0);
  const incomeChange = useIncomeEstimate ? null : pctChange(income, prevIncome);
  const expenseChange = useExpenseEstimate ? null : pctChange(expense, prevExpense);

  return { isFuture, f, tx, income, expense, rate, bal, usingEstimate, useIncomeEstimate, useExpenseEstimate, incomeChange, expenseChange, savedThisMonth };
}

        <div class="section-title" style="margin:0; font-size:15px;">Mes enveloppes</div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button data-open-pincat="1" class="btn-ghost" style="padding:6px 10px; font-size:11.5px; display:flex; align-items:center; gap:4px;">${icon('plus',12)} Ajouter</button>
          <button data-hide-card="showPinnedEnvelopes" style="color:var(--paperDim); padding:4px;" title="Masquer">${icon('x',15)}</button>
        </div>
      </div>
      ${(state.data.pinnedCategories||[]).length===0 ? `<div class="empty">Aucune catégorie épinglée</div>` : (state.data.pinnedCategories||[]).map(catId=>{
        const cat = catInfo(catId);
        const limit = state.data.budgets[catId] || 0;
        const spent = byCat[catId] || 0;
        const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
        const over = limit>0 && spent>limit;
        const barColor = over ? COLORS.coral : (pct>=80 ? COLORS.amber : cat.color);
        return `
          <div style="margin-bottom:14px;">
            <div class="row" style="margin-bottom:6px;">
              <span style="font-size:13px; display:flex; align-items:center; gap:7px;"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${cat.color};display:inline-block;"></span>${cat.label}</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <button data-quick-tx-cat="${catId}" data-quick-tx-type="expense" class="quick-add-pastille" style="background:${cat.color};" title="Ajouter une dépense">+</button>
                <button data-unpin-cat="${catId}" style="color:var(--paperDim); padding:2px;" title="Retirer">${icon('x',13)}</button>
              </div>
            </div>
            <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${barColor};"></div></div>
            <div class="budget-foot" style="margin-top:6px;"><span class="mono" style="color:${over?'var(--coral)':'var(--paperDim)'}">${fmt2(spent)}</span><span>${limit>0? fmt0(limit)+' limite' : 'pas de limite'}</span></div>
          </div>
        `;
      }).join('')}
    </div>
    ` : ''}
    ${renderForecastCard(f)}
  `;
}

function monthNav(){
  const today = new Date();
  const isCurrent = state.viewY===today.getFullYear() && state.viewM===today.getMonth();
  return `<div class="month-nav">
    <button data-move="-1">${icon('chevronL',16)}</button>
    <div class="label ledger">${MONTHS[state.viewM]} ${state.viewY}</div>
    <button data-move="1">${icon('chevronR',16)}</button>
    ${!isCurrent ? `<button data-goto-today="1" class="today-btn">Aujourd'hui</button>` : ''}
  </div>`;
}

function txRow(t, delBtn){
  const info = catInfo(t.category);
  const isRecurringTx = t.recurringId || (state.data.recurring||[]).some(r=> r.type===t.type && r.category===t.category && r.amount===t.amount);
  return `
    <div class="txrow" ${!delBtn ? `data-view-tx="${t.id}" style="cursor:pointer;"` : ''}>
      <div class="tx-left">
        ${t.photo ? `<img src="${t.photo}" style="width:32px; height:32px; border-radius:9px; object-fit:cover; flex-shrink:0;">` : `<div class="swatch" style="background:${info.color}22;"><span class="dot" style="background:${info.color};"></span></div>`}
        <div style="min-width:0;">
          <div class="tx-note" style="display:flex; align-items:center; gap:5px;">${escapeHtml(t.note || info.label)}${isRecurringTx ? `<span style="color:var(--gold); flex-shrink:0; display:flex;" title="Transaction récurrente">${icon('repeat',12)}</span>` : ''}</div>
          <div class="tx-meta">${info.label} · ${new Date(t.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="tx-amt" style="color:${t.type==='income'?'var(--sage)':'var(--paper)'}">${t.type==='income'?'+':'−'}${fmt2(t.amount)}</div>
        ${delBtn ? `<button class="tx-del" style="color:var(--paperDim);" data-duplicate-tx="${t.id}" title="Dupliquer">${icon('copy',14)}</button>` : ''}
        ${delBtn ? `<button class="tx-del" style="color:var(--paperDim);" data-edit-tx="${t.id}">${icon('pencil',14)}</button>` : ''}
        ${delBtn ? `<button class="tx-del" data-del-tx="${t.id}">${icon('trash',14)}</button>` : `${icon('chevronR',14)}`}
      </div>
    </div>`;
}

/* ---------------- Transactions ---------------- */
function renderTransactions(){
  const q = state.txQuery.trim().toLowerCase();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const realList = visibleTransactions()
    .filter(t => sameMonth(t.date, state.viewY, state.viewM))
    .filter(t => state.txFilter==='all' ? true : t.type===state.txFilter)
    .filter(t => !q || (t.note||'').toLowerCase().includes(q) || catInfo(t.category).label.toLowerCase().includes(q))
    .filter(t => !state.hidePastTx || new Date(t.date) >= todayStart);
  const previewList = recurringPreviewForMonth(state.viewY, state.viewM)
    .filter(t => state.txFilter==='all' ? true : t.type===state.txFilter)
    .filter(t => !q || (t.note||'').toLowerCase().includes(q) || catInfo(t.category).label.toLowerCase().includes(q));
  const list = [...realList, ...previewList].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const recurCount = (state.data.recurring||[]).length;

  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Transactions</div>
      <button class="btn-primary" data-open="addTx">${icon('plus',14)} Ajouter</button>
    </div>
    <div class="month-nav" style="margin-bottom:14px;">
      ${monthNav()}
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div class="search-wrap">${icon('search',15)}<input id="txSearch" placeholder="Rechercher…" value="${escapeHtml(state.txQuery)}" oninput="onTxSearch(this.value)"></div>
      <button class="btn-ghost" data-open-recurmodal="1" style="font-size:12px; display:flex; align-items:center; gap:5px;">${icon('repeat',13)} Récurrences${recurCount?` (${recurCount})`:''}</button>
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div class="filter-pills">
        <button data-filter="all" class="${state.txFilter==='all'?'active':''}">Tout</button>
        <button data-filter="income" class="${state.txFilter==='income'?'active':''}">Entrées</button>
        <button data-filter="expense" class="${state.txFilter==='expense'?'active':''}">Sorties</button>
      </div>
      <button data-toggle-hide-past="1" class="toggle-switch ${state.hidePastTx?'on':''}" style="font-size:11px;">${icon('x',11)} Masquer passées</button>
    </div>
    <div class="card">${list.length===0 ? `<div class="empty">Aucune transaction ce mois-ci</div>` : list.map(t=> t.isPending ? previewTxRow(t) : txRow(t,true)).join('')}</div>
  `;
}
function previewTxRow(t){
  const info = catInfo(t.category);
  return `
    <div class="txrow" data-preview-tx="${t.ruleId}" style="opacity:.6; border:1px dashed var(--line); border-radius:10px; cursor:pointer;">
      <div class="tx-left">
        <div class="swatch" style="background:${info.color}22;"><span class="dot" style="background:${info.color};"></span></div>
        <div style="min-width:0;">
          <div class="tx-note" style="display:flex; align-items:center; gap:5px;">${escapeHtml(t.note || info.label)}<span style="color:var(--gold); font-size:10px; font-weight:600; border:1px solid rgba(212,169,79,.4); border-radius:5px; padding:1px 5px;">PRÉVU</span></div>
          <div class="tx-meta">${info.label} · ${new Date(t.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</div>
        </div>
      </div>
      <div class="tx-amt" style="color:${t.type==='income'?'var(--sage)':'var(--paper)'}">${t.type==='income'?'+':'−'}${fmt2(t.amount)}</div>
    </div>`;
}

/* ---------------- Budgets ---------------- */
let budgetEditingId = null;
function renderGaugeCard(stats){
  const tx = stats.tx || monthTx();
  const byCat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const hidden = state.data.hiddenBudgetCategories||[];
  const hiddenCount = hidden.length;
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));

  const nonRecurringCats = catsForType('expense').filter(c=>!recurringCatIds.has(c.id) && c.id!=='epargne' && c.id!=='virement');
  const totalRollover = nonRecurringCats.reduce((s,c)=> s + (state.data.categoryRollover[c.id]||0), 0);
  const globalLimit = nonRecurringCats.reduce((s,c)=> s + effectiveLimit(c.id), 0);
  const globalBaseLimit = nonRecurringCats.reduce((s,c)=> s + (state.data.budgets[c.id]||0), 0);
  const globalSpent = nonRecurringCats.reduce((s,c)=> s + (byCat[c.id]||0), 0);
  const globalPct = globalLimit>0 ? Math.min(100, Math.round(globalSpent/globalLimit*100)) : 0;
  const globalOver = globalLimit>0 && globalSpent>globalLimit;
  const committedKey = state.viewY + '-' + state.viewM;
  const committedThisMonth = state.data.envelopeCommitted[committedKey] || 0;
  const remaining = Math.max(0, globalLimit - globalSpent - committedThisMonth);
  const alwaysShow = new Set(state.data.gaugeAlwaysShow||[]);
  const gaugeSegments = nonRecurringCats
    .map(c=>({ id:c.id, color:c.color, label:c.label, value: byCat[c.id]||0 }))
    .filter(s=>s.value>0 || alwaysShow.has(s.id))
    .sort((a,b)=>b.value-a.value);

  return `
    <div class="card">
      ${renderBalanceContent(stats, true)}
      <div style="height:1px; background:var(--line); margin:16px 0;"></div>
      ${globalLimit>0 ? `
        <div class="row" style="margin-bottom:14px; align-items:flex-start;">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="section-title" style="margin:0; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; letter-spacing:normal;">Total de mes enveloppes</div>
            <button data-open-gaugecat="1" class="btn-ghost" style="padding:9px 11px; font-size:13px; min-width:34px; min-height:34px; display:flex; align-items:center; justify-content:center;" title="Ajouter une catégorie">${icon('plus',14)}</button>
          </div>
          <span class="mono" style="font-size:14px; font-weight:600; color:var(--paper); line-height:1;">${globalPct}%</span>
        </div>
        <div class="catbar-track" style="height:18px; display:flex; overflow:hidden; gap:2px; border:1px solid var(--line);">
          ${gaugeSegments.map(s=>`<div style="width:${Math.min(100,(s.value/globalLimit*100))}%; background:${s.color}; height:100%;" title="${escapeHtml(s.label)}: ${fmt0(s.value)}"></div>`).join('')}
        </div>
        <div class="budget-foot" style="margin-top:10px; font-size:13.5px;">
          <span class="mono" style="color:${globalOver?'var(--coral)':'var(--paper)'}; font-weight:600;">${fmt2(globalSpent)}</span>
          <span style="color:var(--paperDim);">sur <span class="mono" style="color:var(--paper);">${fmt0(globalLimit)}</span></span>
        </div>
        ${(state.data.rolloverEnabled && totalRollover>0) ? `<div style="font-size:11px; color:var(--paperDim); margin-top:2px;">dont ${fmt0(globalBaseLimit)} de limites fixées + ${fmt0(totalRollover)} reportés des mois précédents</div>` : ''}
        <div style="height:1px; background:var(--line); margin:14px 0;"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;">
          ${gaugeSegments.map(s=>`
            <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
              <span style="font-size:12.5px; color:var(--paper); display:flex; align-items:center; gap:6px; min-width:0;">
                <span style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block; flex-shrink:0;"></span>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.label}</span>
              </span>
              <span style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                <span class="mono" style="font-size:12px; color:var(--paperDim);">${fmt0(s.value)}</span>
                <button data-quick-tx-cat="${s.id}" data-quick-tx-type="expense" class="quick-add-pastille" style="background:${s.color};" title="Ajouter une dépense">+</button>
              </span>
            </div>
          `).join('')}
        </div>
        ${remaining>0 ? `
          <button data-allocate-remaining="save" data-remaining-amount="${remaining}" class="row" style="margin-top:14px; margin-bottom:0; width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer;">
            <span style="font-size:12.5px; color:var(--paperDim); display:flex; align-items:center; gap:5px;">Reste à dépenser ${icon('chevronR',11)}</span>
            <span class="mono" style="font-size:16px; font-weight:700; color:var(--mint);">${fmt0(remaining)}</span>
          </button>
          <div style="font-size:10.5px; color:var(--paperDim); margin-top:4px;">Tape pour mettre ce solde de côté — tes limites repartent à zéro le mois prochain, comme prévu.</div>
        ` : `
          <div class="row" style="margin-top:14px; margin-bottom:0;">
            <span style="font-size:12.5px; color:var(--paperDim);">Reste à dépenser</span>
            <span class="mono" style="font-size:16px; font-weight:700; color:var(--paperDim);">0 €</span>
          </div>
          <div style="font-size:10.5px; color:var(--paperDim); margin-top:4px;">${committedThisMonth>0 ? 'Tout a été mis de côté ce mois-ci' : 'Budget entièrement utilisé ce mois-ci'} — ça repart de zéro le mois prochain.</div>
        `}
        ${totalRollover>0 ? `
          <div style="margin-top:10px; background:var(--surfaceHi); border-radius:10px; padding:10px 12px;">
            <div class="row" style="margin-bottom:4px;">
              <span style="font-size:11.5px; color:var(--paperDim); display:flex; align-items:center; gap:5px;">${icon('repeat',11)} Report cumulé des mois précédents</span>
              <button data-allocate-rollover="1" data-remaining-amount="${totalRollover}" class="btn-ghost" style="font-size:11px; padding:6px 9px;">${fmt0(totalRollover)} → Épargner</button>
            </div>
            <div style="font-size:10.5px; color:var(--paperDim); line-height:1.5;">${state.data.rolloverEnabled ? `Tu n'as pas dépensé tout ton budget certains mois passés — ces ${fmt0(totalRollover)} non utilisés s'ajoutent à tes limites de ce mois. Tape "Épargner" pour les mettre de côté plutôt et repartir sur tes limites de base.` : `Tu n'as pas dépensé tout ton budget certains mois passés — ${fmt0(totalRollover)} de côté, sans avoir été ajoutés à tes limites (le report est désactivé). Tape "Épargner" pour les basculer vers un objectif.`}</div>
          </div>
        ` : ''}
      ` : `<div class="empty" style="padding:12px 0 16px;">Toutes les catégories sont masquées.</div>`}
      <div style="height:1px; background:var(--line); margin:16px 0;"></div>
      <div style="display:flex; gap:8px;">
        <button data-allocate-quick="withdraw" data-remaining-amount="${remaining}" style="background:var(--coral); color:var(--ink); font-weight:800; font-size:18px; width:44px; height:44px; border-radius:12px; border:none; flex-shrink:0;" title="Retirer rapidement">−</button>
        <button data-allocate-remaining="quick" data-remaining-amount="${remaining}" class="btn-primary" style="flex:1; justify-content:center; font-size:13px;">${icon('faceid',14)} Épargne <span class="mono" style="opacity:.75; font-weight:600;">· ${fmt0((state.data.goals||[]).reduce((s,g)=>s+g.current,0))}</span></button>
        <button data-allocate-quick="add" data-remaining-amount="${remaining}" style="background:var(--sage); color:var(--ink); font-weight:800; font-size:18px; width:44px; height:44px; border-radius:12px; border:none; flex-shrink:0;" title="Ajouter rapidement">+</button>
      </div>
    </div>
  `;
}

function renderBudgets(){
  const tx = monthTx();
  const byCat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const hidden = state.data.hiddenBudgetCategories||[];
  const allExpenseCats = catsForType('expense').filter(c=>!hidden.includes(c.id));
  const hiddenCount = hidden.length;
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));

  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Budgets par catégorie</div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${monthNav()}
        <button class="btn-ghost" data-open-managecat="1" style="padding:8px; display:flex;" title="Gérer les catégories">${icon('tag',15)}</button>
        ${hiddenCount ? `<button class="btn-ghost" data-open-hiddencat="1" style="font-size:11px; padding:8px; display:flex; align-items:center; gap:4px;" title="Catégories masquées">${icon('x',12)} ${hiddenCount}</button>` : ''}
      </div>
    </div>
    <div class="budget-stack">
      ${allExpenseCats.map(cat=>{
        const baseLimit = state.data.budgets[cat.id] || 0;
        const rollover = state.data.categoryRollover[cat.id] || 0;
        const limit = baseLimit + rollover;
        const spent = byCat[cat.id] || 0;
        const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
        const over = limit>0 && spent>limit;
        const barColor = over ? COLORS.coral : (pct>=80 ? COLORS.amber : cat.color);
        const editing = budgetEditingId === cat.id;
        const isRecurring = recurringCatIds.has(cat.id);
        const expanded = state.expandedBudgetCat === cat.id;
        const catTx = tx.filter(t=>t.type==='expense' && t.category===cat.id).sort((a,b)=> new Date(b.date)-new Date(a.date));
        return `
          <div class="card" style="margin-bottom:0; position:relative;">
            <div class="budget-head">
              <button data-toggle-budget-detail="${cat.id}" class="budget-cat" style="background:none; border:none; padding:0; cursor:pointer;">
                <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${cat.color};display:inline-block;"></span>${cat.label}
                ${isRecurring ? `<span title="Liée à une récurrence" style="color:var(--paperDim); display:flex;">${icon('repeat',12)}</span>` : ''}
                ${catTx.length>0 ? `<span style="color:var(--paperDim); display:flex; transform:rotate(${expanded?90:0}deg); transition:transform .15s;">${icon('chevronR',12)}</span>` : ''}
              </button>
              <div style="display:flex; align-items:center; gap:4px;">
                <button data-quick-tx-cat="${cat.id}" data-quick-tx-type="expense" class="quick-add-pastille" style="background:${cat.color}; margin-right:8px;" title="Ajouter une dépense">+</button>
                ${editing ? `<div class="budget-limit-edit"><input id="budgetInput-${cat.id}" type="number" value="${baseLimit}"><button data-save-budget="${cat.id}">OK</button></div>` : `<button class="budget-limit-btn" data-edit-budget="${cat.id}">limite : <span class="mono" style="color:var(--paper); font-size:16px;">${fmt0(baseLimit)}</span></button>`}
                <button data-hide-budgetcat="${cat.id}" style="color:var(--paperDim); padding:4px;" title="Masquer cette catégorie">${icon('x',13)}</button>
              </div>
            </div>
            <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${barColor};"></div></div>
            <div class="budget-foot"><span class="mono" style="color:${over?'var(--coral)':'var(--paperDim)'}">${fmt2(spent)} dépensés${changeBadge(pctChange(spent, prevMonthCatSpend(cat.id)),'down')}</span><span>${limit>0? pct+'%' : '—'}</span></div>
            ${rollover>0 ? `<div style="font-size:11px; color:var(--mint); margin-top:4px;">${icon('repeat',10)} +${fmt0(rollover)} reporté des mois précédents</div>` : ''}
            ${expanded && catTx.length>0 ? `
              <div style="margin-top:10px; border-top:1px solid var(--lineSoft); padding-top:6px;">
                ${catTx.map(t=>txRow(t,false)).join('')}
              </div>
            ` : ''}
            <div class="quick-chips" style="margin-top:10px;">
              ${[10,50].map(v=>`<button class="chip chip-add" data-budget-adjust="${cat.id}" data-amt="${v}">+${v}€</button>`).join('')}
              ${[10,50].map(v=>`<button class="chip chip-sub" data-budget-adjust="${cat.id}" data-amt="${-v}">−${v}€</button>`).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ---------------- Goals ---------------- */
function renderGoals(){
  const allGoals = state.data.goals;
  const goals = state.activeAccountFilter ? allGoals.filter(g=>(g.accountId||'main')===state.activeAccountFilter) : allGoals;
  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Objectifs d'épargne</div>
      <button class="btn-primary" data-open="addGoal">${icon('plus',14)} Nouvel objectif</button>
    </div>
    <button data-open-habitcalc="1" class="btn-ghost" style="width:100%; justify-content:center; margin-bottom:14px; display:flex; align-items:center; gap:7px;">${icon('flame',14)} Combien coûte une habitude ?</button>
    ${goals.length===0 ? `<div class="card empty">Aucun objectif pour l'instant. Créez-en un pour commencer à mettre de côté.</div>` : `
      <div class="budget-stack">
        ${goals.map(g=>{
          const pct = g.target>0 ? Math.min(100, Math.round(g.current/g.target*100)) : 0;
          const done = pct>=100;
          const transfer = (state.data.goalTransfers||[]).find(t=>t.goalId===g.id);
          const goalAcc = (state.data.accounts||[]).find(a=>a.id===(g.accountId||'main'));
          const showAccBadge = !state.activeAccountFilter && (state.data.accounts||[]).length>1 && goalAcc;
          return `
            <div class="card goal-card" style="margin-bottom:0;">
              ${done ? `<div class="goal-badge">${icon('spark',11)} Atteint</div>` : ''}
              ${showAccBadge ? `<div style="display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:${goalAcc.color}; margin-bottom:6px;"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:${goalAcc.color};display:inline-block;"></span>${escapeHtml(goalAcc.name)}</div>` : ''}
              <div class="goal-name">${escapeHtml(g.name)}</div>
              <div class="goal-amt" style="color:${g.color}">${fmt0(g.current)} <span class="target">/ ${fmt0(g.target)}</span></div>
              <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${g.color};"></div></div>
              <div class="row" style="margin-top:10px; margin-bottom:0;">
                <button data-open-goaltransfer="${g.id}" style="display:flex; align-items:center; gap:6px; color:${transfer?g.color:'var(--paperDim)'}; font-size:11.5px; background:none; border:none; padding:0;">
                  ${icon('repeat',12)} ${transfer ? `${fmt0(transfer.amount)} ${freqLabel(transfer.frequency).toLowerCase()} — virement auto` : 'Configurer un virement automatique'}
                </button>
                ${transfer ? `<button data-stop-goaltransfer="${g.id}" style="font-size:10.5px; color:var(--coral); background:none; border:none; padding:0;">Arrêter</button>` : ''}
              </div>
              ${g.deadline && !done ? (()=>{
                const dl = new Date(g.deadline);
                const now = new Date();
                const monthsLeft = Math.max(1, Math.round((dl - now) / (1000*60*60*24*30.44)));
                const remaining = Math.max(0, g.target - g.current);
                const perMonth = remaining / monthsLeft;
                const overdue = dl < now;
                return `<div style="font-size:11.5px; color:${overdue?'var(--coral)':'var(--paperDim)'}; margin-top:8px;">
                  ${overdue ? "Échéance dépassée" : `Échéance : ${dl.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}`}
                  ${!overdue ? ` · suggéré <span class="mono" style="color:${g.color};">${fmt0(perMonth)}</span>/mois` : ''}
                </div>`;
              })() : ''}
              <div class="quick-chips" style="margin-top:12px;">
                ${[10,50,100].map(v=>`<button class="chip chip-add" data-quick-contribute="${g.id}" data-amt="${v}">+${v}€</button>`).join('')}
                ${[10,50].map(v=>`<button class="chip chip-sub" data-quick-withdraw="${g.id}" data-amt="${v}">−${v}€</button>`).join('')}
              </div>
              <div class="goal-form">
                <input id="goalAmount-${g.id}" type="number" placeholder="Autre montant">
                <button class="add" data-contribute="${g.id}">Ajouter</button>
                <button class="withdraw" data-withdraw="${g.id}">Retirer</button>
                <button class="del" data-del-goal="${g.id}">${icon('trash',14)}</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

/* ---------------- events ---------------- */
function onTxSearch(v){ state.txQuery = v; rerender(); }
window.onTxSearch = onTxSearch;

function bindEvents(){
  const app = document.getElementById('app');
  const headerEl = app.querySelector('.header');
  if(headerEl) document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');

  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.tab === state.tab) return;
    setState({tab: el.dataset.tab});
    window.scrollTo(0,0);
  }));
  app.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click', ()=> moveMonth(Number(el.dataset.move))));
  app.querySelectorAll('[data-toggle-banner]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.bannerCollapsed = !d.bannerCollapsed; }); }));
  app.querySelectorAll('[data-banner-item]').forEach(el=>el.addEventListener('click', ()=>{
    const [source, id] = el.dataset.bannerItem.split(':');
    if(source==='tx'){ openEditTx(id); }
    else { state.recurringModalOpen = true; rerender(); }
  }));
  app.querySelectorAll('[data-preview-tx]').forEach(el=>el.addEventListener('click', ()=>{ state.recurringModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-goto-today]').forEach(el=>el.addEventListener('click', ()=>{
    const today = new Date();
    setState({ viewY: today.getFullYear(), viewM: today.getMonth() });
  }));
  app.querySelectorAll('[data-toggle-recent]').forEach(el=>el.addEventListener('click', ()=>{ state.recentExpanded = !state.recentExpanded; rerender(); }));
  app.querySelectorAll('[data-goto-month]').forEach(el=>el.addEventListener('click', ()=>{
    const [y,m] = el.dataset.gotoMonth.split('-').map(Number);
    setState({ viewY: y, viewM: m });
    window.scrollTo(0,0);
  }));
  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.open==='addTx'){ txFormState = { type:'expense', category:EXPENSE_CATS[0].id, date:defaultTxDate(), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null, photo:null, accountId: state.activeAccountFilter || txFormState.accountId || 'main' }; state.txAdvancedOpen = false; state.txDuplicateWarning = false; }
    if(el.dataset.open==='addGoal'){ goalFormState = { color: COLORS.sage }; }
    setState({modal: el.dataset.open});
  }));
  app.querySelectorAll('[data-quick-add]').forEach(el=>el.addEventListener('click', ()=>{
    const type = el.dataset.quickAdd;
    txFormState = { type, category:(type==='expense'?EXPENSE_CATS:INCOME_CATS)[0].id, date:defaultTxDate(), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null, photo:null, accountId: state.activeAccountFilter || txFormState.accountId || 'main' };
    state.txAdvancedOpen = false;
    state.txDuplicateWarning = false;
    setState({modal:'addTx'});
    const amtEl = document.getElementById('txAmount');
    if(amtEl) amtEl.focus();
  }));
  app.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ setState({modal:null}); } }));
  app.querySelectorAll('[data-close-x-modal]').forEach(el=>el.addEventListener('click', ()=>{ setState({modal:null}); }));

  app.querySelectorAll('[data-del-tx]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.delTx;
    const tx = state.data.transactions.find(t=>t.id===id);
    if(!tx) return;
    const pair = tx.transferId ? state.data.transactions.find(t=>t.transferId===tx.transferId && t.id!==tx.id) : null;
    const reverseGoalEffect = (d, t, sign)=>{
      if(!t.goalId || (t.category!=='epargne' && t.category!=='epargne_retour')) return;
      const g = d.goals.find(g=>g.id===t.goalId);
      if(!g) return;
      const delta = t.category==='epargne' ? t.amount : -t.amount;
      g.current = Math.max(0, g.current + delta*sign);
    };
    const reverseCommitted = (d, t, sign)=>{
      if(!t.committedMonth) return;
      d.envelopeCommitted[t.committedMonth] = Math.max(0, (d.envelopeCommitted[t.committedMonth]||0) + t.amount*sign);
    };
    mutateData(d=>{
      d.transactions = d.transactions.filter(t=>t.id!==id && (!pair || t.id!==pair.id));
      reverseGoalEffect(d, tx, -1);
      reverseCommitted(d, tx, -1);
      if(pair) reverseGoalEffect(d, pair, -1);
    });
    showUndoToast(pair ? 'Virement supprimé' : 'Transaction supprimée', ()=>{
      mutateData(d=>{
        d.transactions.unshift(tx); if(pair) d.transactions.unshift(pair);
        reverseGoalEffect(d, tx, 1);
        reverseCommitted(d, tx, 1);
        if(pair) reverseGoalEffect(d, pair, 1);
      });
    });
  }));
  app.querySelectorAll('[data-edit-tx]').forEach(el=>el.addEventListener('click', ()=>{ openEditTx(el.dataset.editTx); }));
  app.querySelectorAll('[data-duplicate-tx]').forEach(el=>el.addEventListener('click', ()=>{
    const t = state.data.transactions.find(t=>t.id===el.dataset.duplicateTx);
    if(!t) return;
    txFormState = { type:t.type, category:t.category, date:defaultTxDate(), recurring:false, frequency:'monthly', note:t.note||'', amount:t.amount, editingId:null, photo:null, accountId:t.accountId||'main' };
    state.txAdvancedOpen = false;
    state.txDuplicateWarning = false;
    setState({modal:'addTx'});
  }));
  app.querySelectorAll('[data-view-tx]').forEach(el=>el.addEventListener('click', ()=>{ openEditTx(el.dataset.viewTx); }));
  app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click', ()=> setState({txFilter: el.dataset.filter})));
  app.querySelectorAll('[data-toggle-hide-past]').forEach(el=>el.addEventListener('click', ()=> setState({hidePastTx: !state.hidePastTx})));

      .filter(t=> new Date(t.date) > now0 && isLinkedToRecurring(t))
      .map(t=> ({ note:t.note, date:t.date, daysUntil: Math.ceil((new Date(t.date)-now0)/86400000), src:'transaction' }));
    const pendingRules = upcomingRecurring(365).map(r=> ({ note:r.note, date:r.nextDate, daysUntil: Math.ceil((r.next-now0)/86400000), src:'règle' }));
    const combined = [...futureRealTx, ...pendingRules].sort((a,b)=> new Date(a.date)-new Date(b.date)).slice(0,6);
    const lines = combined.map(x=> `${x.note} (${x.src}) — ${x.daysUntil}j — ${new Date(x.date).toLocaleDateString('fr-FR')}`).join('\n');
    const suspects = state.data.transactions.filter(t=> (t.note||'').toLowerCase().includes('canal') || (t.note||'').toLowerCase().includes('remboursement'));
    const suspectLines = suspects.map(t=>{
      const linked = isLinkedToRecurring(t);
      const matchingRule = rules0.find(r=> r.category===t.category && r.amount===t.amount) || rules0.find(r=> r.amount===t.amount && (r.note||'').trim()===(t.note||'').trim() && (r.note||'').trim()!=='');

    }).join('\n\n');
