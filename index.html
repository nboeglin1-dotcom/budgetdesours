<style>
  :root{
    color-scheme: dark;
    --ink:#0E1626;
    --bg:#0E1626; --surface:#151F35; --surfaceHi:#1C2A47;
    --line:#2B3B5C; --lineSoft:#1E2C48;
    --paper:#F2EDDE; --paperDim:#96A0BC;
    --gold:#D4A94F; --coral:#E8664D; --sage:#6FA287;
    --violet:#8B7FD6; --teal:#5FB4C4; --rose:#D6829F; --slate:#7C89A6; --amber:#C97B3F; --mint:#4FBF8B;
  }
  input:not([type="checkbox"]), .field-input, .budget-limit-edit input, .goal-form input, .search-wrap input{
    -webkit-appearance:none; appearance:none; color-scheme: dark;
  }
  input[type="checkbox"]{ -webkit-appearance:auto; appearance:auto; color-scheme: dark; }
  input::-webkit-date-and-time-value{ text-align:left; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--paper); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .ledger{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  button{cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; touch-action:manipulation;}
  button:active{transform:scale(0.96); transition:transform .08s ease;}
  .tabbar button:active, .cat-opt:active, .color-swatch:active{transform:scale(0.92);}
  a, input, .card, .txrow{touch-action:manipulation;}
  input{font-family:inherit; font-size:inherit; color:inherit;}
  input:focus, button:focus{outline:none;}
  ::selection{background:var(--gold); color:var(--ink);}
  #app{max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .page{animation:pageIn .22s ease both;}
  @keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .scroll-cats, .modal-sheet{-webkit-overflow-scrolling:touch;}
  .header{position:sticky; top:0; z-index:20; background:rgba(14,22,38,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--gold); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;}
  .brand-name{font-size:17px; font-weight:600; line-height:1; color:var(--paper) !important;}
  .brand-sub{font-size:10.5px; color:var(--paperDim); margin-top:2px;}
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(21,31,53,.96); backdrop-filter:blur(14px);

window.addEventListener('error', function(e){
  try{
    var el = document.getElementById('app');
    if(el && !el.dataset.crashHandled){
      el.dataset.crashHandled = '1';
      el.innerHTML = '<div style="padding:50px 22px; color:#F2EDDE; font-family:sans-serif; line-height:1.5; max-width:480px; margin:0 auto;">'
        + '<div style="font-size:20px; font-weight:700; color:#E8664D; margin-bottom:10px;">Un problème est survenu</div>'
        + '<div style="font-size:14px; opacity:.85; margin-bottom:18px;">' + (e && e.message ? String(e.message) : 'Erreur inconnue') + '</div>'
        + '<div style="font-size:12px; opacity:.6; margin-bottom:22px;">Ligne : ' + (e && e.lineno ? e.lineno : '?') + '</div>'
        + '<button id="crashExportBtn" style="width:100%; padding:13px; border-radius:13px; background:#D4A94F; color:#0E1626; font-weight:600; font-size:14.5px; border:none; margin-bottom:10px;">Exporter mes données avant de recharger</button>'
        + '<button id="crashReloadBtn" style="width:100%; padding:13px; border-radius:13px; background:#1C2A47; color:#F2EDDE; font-weight:600; font-size:14.5px; border:1px solid #2B3B5C;">Recharger l\'appli</button>'
        + '</div>';
      var exportBtn = document.getElementById('crashExportBtn');
      if(exportBtn) exportBtn.addEventListener('click', function(){
        try{
          var raw = localStorage.getItem('solde-budget-data-v1') || '{}';
          var blob = new Blob([raw], { type:'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = 'solde-secours-' + new Date().toISOString().slice(0,10) + '.json';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }catch(err2){}
      });
      var reloadBtn = document.getElementById('crashReloadBtn');
      if(reloadBtn) reloadBtn.addEventListener('click', function(){ location.reload(); });
    }
  }catch(err){}
});
/* ---------------- data model ---------------- */
const COLORS = { gold:'#D4A94F', coral:'#E8664D', sage:'#6FA287', violet:'#8B7FD6', teal:'#5FB4C4', rose:'#D6829F', slate:'#7C89A6', amber:'#C97B3F', mint:'#4FBF8B' };

const THEMES = {
  ledger: {
    name: 'Grand livre',
    bg:'var(--ink)', surface:'#151F35', surfaceHi:'#1C2A47', line:'#2B3B5C', lineSoft:'#1E2C48',
    paper:'#F2EDDE', paperDim:'#96A0BC', gold:'#D4A94F', mint:'#4FBF8B', scheme:'dark',
  },
  light: {
    name: 'Clair',
    bg:'#F7F5F0', surface:'#FFFFFF', surfaceHi:'#F0EDE6', line:'#E2DED4', lineSoft:'#EDEAE2',
    paper:'#1A1A2E', paperDim:'#75758A', gold:'#C48A2E', mint:'#2E9E71', scheme:'light',
  },
};

function applyTheme(name){
  const t = THEMES[name] || THEMES.ledger;
  const root = document.documentElement.style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--surface', t.surface);
  root.setProperty('--surfaceHi', t.surfaceHi);
  root.setProperty('--line', t.line);
  root.setProperty('--lineSoft', t.lineSoft);
  root.setProperty('--paper', t.paper);
  root.setProperty('--paperDim', t.paperDim);
  root.setProperty('--gold', t.gold);
  root.setProperty('--mint', t.mint);
  root.setProperty('color-scheme', t.scheme || 'dark');
  const metaScheme = document.querySelector('meta[name="color-scheme"]');
  if(metaScheme) metaScheme.setAttribute('content', t.scheme || 'dark');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', t.bg==='var(--ink)' ? '#0E1626' : t.bg);
}

const EXPENSE_CATS = [
  {id:'alimentation', label:'Alimentation', color:COLORS.coral, type:'expense'},
  {id:'logement', label:'Logement', color:COLORS.gold, type:'expense'},
  {id:'transport', label:'Transport', color:COLORS.sage, type:'expense'},
  {id:'loisirs', label:'Loisirs', color:COLORS.violet, type:'expense'},
  {id:'sante', label:'Santé', color:COLORS.teal, type:'expense'},
  {id:'shopping', label:'Shopping', color:COLORS.rose, type:'expense'},
  {id:'abonnements', label:'Abonnements', color:COLORS.amber, type:'expense'},
  {id:'epargne', label:'Dépôt sur épargne', color:COLORS.mint, type:'expense'},
  {id:'autres_d', label:'Autres', color:COLORS.slate, type:'expense'},
];
const INCOME_CATS = [
  {id:'salaire', label:'Salaire', color:COLORS.gold, type:'income'},
  {id:'freelance', label:'Freelance', color:COLORS.sage, type:'income'},
  {id:'epargne_retour', label:"Retrait d'épargne", color:COLORS.mint, type:'income'},
  {id:'autres_i', label:'Autres', color:COLORS.slate, type:'income'},
];
const ALL_CATS = [...EXPENSE_CATS, ...INCOME_CATS];

function catInfo(id){
  const custom = (state.data.customCategories||[]).find(c=>c.id===id);
  if(custom) return custom;
  const base = ALL_CATS.find(c=>c.id===id) || EXPENSE_CATS[7];
  const override = (state.data.categoryColorOverrides||{})[id];
  return override ? { ...base, color: override } : base;
}
function catsForType(type){
  const custom = (state.data.customCategories||[]).filter(c=>c.type===type);
  const base = (type==='expense'?EXPENSE_CATS:INCOME_CATS).map(c=>{
    const override = (state.data.categoryColorOverrides||{})[c.id];
    return override ? { ...c, color: override } : c;
  });
  return [...base, ...custom];
}
function findCategoryIdByLabel(label, type){
  const found = catsForType(type).find(c => c.label.toLowerCase() === label.toLowerCase());
  return found ? found.id : null;
}
function freqLabel(f){ return {weekly:'Chaque semaine', monthly:'Chaque mois', yearly:'Chaque année'}[f] || f; }
function addPeriod(date, freq){
  const d = new Date(date);
  if(freq==='weekly') d.setDate(d.getDate()+7);
  else if(freq==='yearly') d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d;
}
function occurrencesPerMonth(freq){
  if(freq==='weekly') return 52/12;
  if(freq==='yearly') return 1/12;
  return 1;
}
function recurringOccurrencesInMonth(y, m){
  let income = 0, expense = 0;
  (state.data.recurring||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while((next.getFullYear() < y || (next.getFullYear()===y && next.getMonth() < m)) && guard < 800){
      next = addPeriod(next, rule.frequency);
      guard++;
    }
    while(next.getFullYear()===y && next.getMonth()===m && guard<900){
      if(rule.type==='income') income += rule.amount; else expense += rule.amount;
      next = addPeriod(next, rule.frequency);
      guard++;
    }
  });
  return { income, expense };
}
function upcomingRecurring(days){
  const now = new Date();
  const cutoff = new Date(now.getTime() + days*86400000);
  return (state.data.recurring||[])
    .map(r=>({ ...r, next: new Date(r.nextDate) }))
    .filter(r=> r.next >= now && r.next <= cutoff)
    .sort((a,b)=> a.next - b.next)
    .map(r=>({ ...r, daysUntil: Math.ceil((r.next - now) / 86400000) }));
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.customCategories) parsed.customCategories = [];
      if(!parsed.recurring) parsed.recurring = [];
      if(!parsed.security) parsed.security = { enabled:false, pin:null, useBiometric:false, credentialId:null };
      if(!parsed.accounts || !parsed.accounts.length) parsed.accounts = [{ id:'main', name:'Compte principal', color: COLORS.gold }];
      if(!parsed.dashboardSettings) parsed.dashboardSettings = { showBreakdown:true, showTrend:true };
      if(parsed.dashboardSettings.showEnvelopesGauge===undefined) parsed.dashboardSettings.showEnvelopesGauge = true;
      if(parsed.dashboardSettings.showForecast===undefined) parsed.dashboardSettings.showForecast = true;
      if(parsed.dashboardSettings.showPinnedEnvelopes===undefined) parsed.dashboardSettings.showPinnedEnvelopes = true;
      if(!parsed.gaugeAlwaysShow){
        const essenceCustom = (parsed.customCategories||[]).find(c=>c.type==='expense' && c.label.toLowerCase()==='essence');
        parsed.gaugeAlwaysShow = ['autres_d', essenceCustom ? essenceCustom.id : null].filter(Boolean);
      }
      if(!parsed.categoryColorOverrides) parsed.categoryColorOverrides = {};
      if(!parsed.categoryRollover) parsed.categoryRollover = {};
      if(parsed.lastRolloverCheck===undefined) parsed.lastRolloverCheck = null;
      if(!parsed.goalTransfers) parsed.goalTransfers = [];
      if(!parsed.theme) parsed.theme = 'ledger';
      if(!parsed.pinnedCategories){
        const essenceCustom = (parsed.customCategories||[]).find(c=>c.type==='expense' && c.label.toLowerCase()==='essence');
        parsed.pinnedCategories = [essenceCustom ? essenceCustom.id : 'transport', 'loisirs', 'autres_d'];
      }
      if(!parsed.hiddenBudgetCategories) parsed.hiddenBudgetCategories = [];
      parsed.transactions.forEach(t=>{ if(!t.accountId) t.accountId = 'main'; });
      if(!Array.isArray(parsed.transactions)) parsed.transactions = [];
      if(!parsed.budgets || typeof parsed.budgets !== 'object') parsed.budgets = {};
      if(!Array.isArray(parsed.goals)) parsed.goals = [];
      parsed.transactions.forEach(t=>{ if(!t.accountId) t.accountId = 'main'; });
      return parsed;
    }
  }catch(e){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) localStorage.setItem(STORAGE_KEY + '-corrupted-backup', raw);
    }catch(e2){}
    window.__soldeDataWasCorrupted = true;
  }
  const seeded = seedData();
  seeded.transactions.forEach(t=>{ t.accountId = 'main'; });
  saveData(seeded);
  return seeded;
}
function saveData(d){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    return true;
  }catch(e){
    if(!window.__soldeStorageWarned){
      window.__soldeStorageWarned = true;
      setTimeout(()=>{ try{ showToast("Stockage plein — exporte une sauvegarde pour libérer de la place"); }catch(e2){} }, 300);
    }
    return false;
  }
}

function processRecurring(){
  const today = new Date();
  let changed = false;
  (state.data.recurring||[]).forEach(rule=>{
    let next = new Date(rule.nextDate);
    let guard = 0;
    while(next <= today && guard < 60){
      state.data.transactions.unshift({ id: uid(), type: rule.type, amount: rule.amount, category: rule.category, note: rule.note, date: next.toISOString() });
      next = addPeriod(next, rule.frequency);
      guard++;
      changed = true;
    }
    rule.nextDate = next.toISOString();
  });
  if(changed) saveData(state.data);
}
function processCategoryRollover(){
  const today = new Date();
  const curKey = today.getFullYear() + '-' + today.getMonth();
  if(!state.data.lastRolloverCheck){
    state.data.lastRolloverCheck = curKey;
    saveData(state.data);
    return;
  }
  if(state.data.lastRolloverCheck === curKey) return;
  const parts = state.data.lastRolloverCheck.split('-').map(Number);
  let y = parts[0], m = parts[1];
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));
  let guard = 0;
  while((y*12+m) < (today.getFullYear()*12+today.getMonth()) && guard < 36){
    const byCat = {};
    state.data.transactions.forEach(t=>{
      if(t.type!=='expense') return;
      const d = new Date(t.date);
      if(d.getFullYear()===y && d.getMonth()===m) byCat[t.category] = (byCat[t.category]||0) + t.amount;
    });
    catsForType('expense').forEach(cat=>{
      if(recurringCatIds.has(cat.id)) return;
      const limit = state.data.budgets[cat.id] || 0;
      if(limit<=0) return;
      const spent = byCat[cat.id] || 0;
      const surplus = Math.max(0, limit - spent);
      if(surplus>0){
        state.data.categoryRollover[cat.id] = Math.round(((state.data.categoryRollover[cat.id]||0) + surplus) * 100) / 100;
      }
    });
    m++; if(m>11){ m=0; y++; }
    guard++;
  }
  state.data.lastRolloverCheck = curKey;
  saveData(state.data);
}
function effectiveLimit(catId){
  return (state.data.budgets[catId]||0) + (state.data.categoryRollover[catId]||0);
}
function processGoalTransfers(){
  const today = new Date();
  let changed = false;
  (state.data.goalTransfers||[]).forEach(rule=>{
    const goal = state.data.goals.find(g=>g.id===rule.goalId);
    if(!goal) return;
    let next = new Date(rule.nextDate);
    let guard = 0;
    while(next <= today && guard < 60){
      goal.current = Math.max(0, goal.current + rule.amount);
      state.data.transactions.unshift({ id: uid(), type:'expense', amount: rule.amount, category:'epargne', note:`Virement auto vers "${goal.name}"`, date: next.toISOString() });
      next = addPeriod(next, rule.frequency);
      guard++;
      changed = true;
    }
    rule.nextDate = next.toISOString();
  });
  if(changed) saveData(state.data);
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function unlockApp(){

function handlePinDigit(d){
  if(state.pinInput.length>=4) return;
  state.pinInput += d;
  if(state.pinInput.length===4){
    if(state.pinInput === state.data.security.pin){
      unlockApp();
    } else {
      state.pinError = true;
      rerender();
      setTimeout(()=>{ state.pinInput=''; state.pinError=false; rerender(); }, 550);
    }
  } else {
    rerender();
  }
}

function handleSetupDigit(d){
  if(state.pinSetupStep!=='confirm'){
    if(state.pinSetupFirst.length>=4) return;
    state.pinSetupFirst += d;
    if(state.pinSetupFirst.length===4){ state.pinSetupStep='confirm'; state.pinConfirm=''; }
    rerender();
  } else {
    if(state.pinConfirm.length>=4) return;
    state.pinConfirm += d;
    if(state.pinConfirm.length===4){
      if(state.pinConfirm === state.pinSetupFirst){
        mutateData(d=>{ d.security.enabled = true; d.security.pin = state.pinSetupFirst; });
        state.pinSetupStep = null; state.pinSetupFirst=''; state.pinConfirm='';
        showToast('Verrouillage activé');
      } else {
        state.pinSetupStep = null; state.pinSetupFirst=''; state.pinConfirm='';
        showToast('Les codes ne correspondent pas, réessayez');
      }
    } else {
      rerender();
    }
  }
}

async function registerBiometric(){
  if(!window.PublicKeyCredential){ showToast('Face ID / Touch ID indisponible sur cet appareil'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge, rp: { name: 'Solde' }, user: { id: userId, name: 'solde-user', displayName: 'Solde' },
        pubKeyCredParams: [{ alg:-7, type:'public-key' }, { alg:-257, type:'public-key' }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
      }
    });
    if(cred){
      const credId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
      mutateData(d=>{ d.security.useBiometric = true; d.security.credentialId = credId; });
      showToast('Face ID / Touch ID activé');
    }
  }catch(e){ showToast("Impossible d'activer Face ID / Touch ID"); }
}

async function tryBiometricUnlock(){
  const sec = state.data.security;
  if(!sec || !sec.credentialId || !window.PublicKeyCredential) return;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const idBytes = Uint8Array.from(atob(sec.credentialId), c=>c.charCodeAt(0));
    const assertion = await navigator.credentials.get({
      publicKey: { challenge, allowCredentials: [{ id: idBytes, type: 'public-key' }], userVerification: 'required', timeout: 60000 }
    });
    if(assertion) unlockApp();
  }catch(e){ /* annulé ou échoué : l'utilisateur peut saisir son code */ }
}

function rerender(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const scrollY = window.scrollY;
  document.getElementById('app').innerHTML = renderApp();
  bindEvents();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  } else { window.scrollTo(0, scrollY); }
}

/* ---------------- Dashboard ---------------- */
function computeYearlyStats(year){
  const txs = state.data.transactions.filter(t=> new Date(t.date).getFullYear()===year);
  const income = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const net = income - expense;
  const rate = income>0 ? Math.max(0, Math.round(net/income*100)) : 0;
  const byCat = {};
  txs.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const catData = Object.entries(byCat).map(([id,value])=>({ id, value, ...catInfo(id) })).sort((a,b)=>b.value-a.value);
  const months = [];
  for(let m=0; m<12; m++){
    const mtx = txs.filter(t=> new Date(t.date).getMonth()===m);
    const inc = mtx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const exp = mtx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    months.push({ m, label: MONTHS_SHORT[m], income:inc, expense:exp, net: inc-exp, hasData: mtx.length>0 });
  }
  const withData = months.filter(mo=>mo.hasData);
  const best = withData.length ? withData.reduce((a,b)=> b.net>a.net ? b : a) : null;
  const worst = withData.length ? withData.reduce((a,b)=> b.net<a.net ? b : a) : null;
  return { income, expense, net, rate, catData, months, best, worst, hasData: txs.length>0 };
}

  const year = state.reviewYear;
  const s = computeYearlyStats(year);
  const maxCat = Math.max(1, ...s.catData.map(c=>c.value));
  const maxMonthAbs = Math.max(1, ...s.months.map(mo=>Math.max(mo.income, mo.expense)));

function computeForecast(){
  const today = new Date();
  const months = [];
  for(let i=2;i>=0;i--){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){m+=12;y--;}
    months.push({y,m});
  }
  const incomes = [], expenses = [];
  months.forEach(({y,m})=>{
    const txs = state.data.transactions.filter(t=>sameMonth(t.date,y,m));
    incomes.push(txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
    expenses.push(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  });
  const avgIncome = incomes.reduce((a,b)=>a+b,0)/incomes.length;
  const avgExpense = expenses.reduce((a,b)=>a+b,0)/expenses.length;
  const hasHistory = incomes.some(v=>v>0) || expenses.some(v=>v>0);
  const netAvg = avgIncome - avgExpense;

  let recurIncomePerMonth = 0, recurExpensePerMonth = 0;
  (state.data.recurring||[]).forEach(rule=>{
    const perMonth = rule.amount * occurrencesPerMonth(rule.frequency);
    if(rule.type==='income') recurIncomePerMonth += perMonth; else recurExpensePerMonth += perMonth;
  });
  const variableIncome = Math.max(0, avgIncome - recurIncomePerMonth);
  const variableExpense = Math.max(0, avgExpense - recurExpensePerMonth);

  const startBalance = totalBalance();
  const points = [];
  let lastValue = startBalance;
  for(let i=1;i<=6;i++){
    let m = today.getMonth()+i, y = today.getFullYear();
    while(m>11){ m-=12; y++; }
    const hasRealDataThisMonth = state.data.transactions.some(t=>sameMonth(t.date,y,m));
    let value;
    if(hasRealDataThisMonth){
      const cutoff = new Date(y, m+1, 0, 23,59,59,999);
      value = state.data.transactions
        .filter(t => new Date(t.date) <= cutoff)
        .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
    } else {
      const rec = recurringOccurrencesInMonth(y,m);
      const monthIncome = variableIncome + rec.income;
      const monthExpense = variableExpense + rec.expense;
      value = lastValue + (monthIncome - monthExpense);
    }
    lastValue = value;
    points.push({ label: `${MONTHS_SHORT[m]} ${String(y).slice(2)}`, value, y, m });
  }
  return { points, avgIncome, avgExpense, netAvg, startBalance, hasHistory, variableIncome, variableExpense };
}

function computeCategoryForecast(targetExpense){
  const today = new Date();
  const months = [];
  for(let i=2;i>=0;i--){
    let m = today.getMonth()-i, y = today.getFullYear();
    if(m<0){m+=12;y--;}
    months.push({y,m});
  }
  const totals = {};
  let grandTotal = 0;
  months.forEach(({y,m})=>{
    state.data.transactions.filter(t=>t.type==='expense' && sameMonth(t.date,y,m)).forEach(t=>{
      totals[t.category] = (totals[t.category]||0) + t.amount;
      grandTotal += t.amount;
    });
  });
  if(grandTotal <= 0) return [];
  return Object.entries(totals)
    .map(([id,sum])=>({ id, value: (sum/grandTotal)*targetExpense, ...catInfo(id) }))
    .sort((a,b)=>b.value-a.value);
}

function monthIndex(y,m){ return y*12+m; }

function balanceForViewedMonth(f, viewY, viewM){
  const today = new Date();
  const curIdx = monthIndex(today.getFullYear(), today.getMonth());
  const viewIdx = monthIndex(viewY, viewM);
  const diff = viewIdx - curIdx;
  const cutoff = new Date(viewY, viewM+1, 0, 23,59,59,999);
  const realBalance = state.data.transactions
    .filter(t => new Date(t.date) <= cutoff)
    .reduce((s,t)=> s + (t.type==='income' ? t.amount : -t.amount), 0);
  if(diff <= 0) return realBalance;
  const hasRealDataThisMonth = state.data.transactions.some(t=>sameMonth(t.date, viewY, viewM));
  if(hasRealDataThisMonth) return realBalance;
  if(diff <= 6) return f.points[diff-1].value;
  return f.startBalance + f.netAvg*diff;
}

  if(!state.data.dashboardSettings.showForecast) return '';
  const f = computeForecast();

  return `

  `;
}

function pctChange(current, previous){
  if(!previous || previous<=0) return null;
  return Math.round((current-previous)/previous*100);
}
function changeBadge(pct, goodDirection){
  if(pct===null || pct===undefined) return '';
  const isUp = pct>0;
  const isFlat = pct===0;
  const isGood = goodDirection==='up' ? isUp : !isUp;
  const color = isFlat ? 'var(--paperDim)' : (isGood ? 'var(--sage)' : 'var(--coral)');
  const arrow = isFlat ? '' : (isUp ? '↑' : '↓');
  return ` <span class="mono" style="font-size:10.5px; color:${color};">${arrow}${Math.abs(pct)}%</span>`;
}
function prevMonthCatSpend(catId){
  let m = state.viewM - 1, y = state.viewY;
  if(m<0){ m = 11; y--; }
  return state.data.transactions
    .filter(t=>t.type==='expense' && t.category===catId && sameMonth(t.date, y, m))
    .reduce((s,t)=>s+t.amount, 0);
}
function computeMonthStats(){
  const today = new Date();
  const curIdx = monthIndex(today.getFullYear(), today.getMonth());
  const viewIdx = monthIndex(state.viewY, state.viewM);
  const isFuture = viewIdx > curIdx;

  const f = computeForecast();
  const tx = monthTx();
  const realIncome = tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const realExpense = tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const usingEstimate = isFuture && tx.length===0;
  const recurThisMonth = usingEstimate ? recurringOccurrencesInMonth(state.viewY, state.viewM) : {income:0, expense:0};
  const income = usingEstimate ? (f.variableIncome + recurThisMonth.income) : realIncome;
  const expense = usingEstimate ? (f.variableExpense + recurThisMonth.expense) : realExpense;
  const savings = income - expense;
  const rate = income>0 ? Math.max(0, Math.round(savings/income*100)) : 0;
  const bal = balanceForViewedMonth(f, state.viewY, state.viewM);

  let pm = state.viewM - 1, py = state.viewY;
  if(pm<0){ pm = 11; py--; }
  const prevTx = state.data.transactions.filter(t=>sameMonth(t.date, py, pm));
  const prevIncome = prevTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const prevExpense = prevTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const incomeChange = usingEstimate ? null : pctChange(income, prevIncome);
  const expenseChange = usingEstimate ? null : pctChange(expense, prevExpense);

  return { isFuture, f, tx, income, expense, rate, bal, usingEstimate, incomeChange, expenseChange };
}

            <div class="budget-foot" style="margin-top:6px;"><span class="mono" style="color:${over?'var(--coral)':'var(--paperDim)'}">${fmt2(spent)}</span><span>${limit>0? fmt0(limit)+' limite' : 'pas de limite'}</span></div>
          </div>
        `;
      }).join('')}
    </div>
    ` : ''}
    ${renderForecastCard()}
  `;
}

function monthNav(){
  const today = new Date();
  const isCurrent = state.viewY===today.getFullYear() && state.viewM===today.getMonth();
  return `<div class="month-nav">
    <button data-move="-1">${icon('chevronL',16)}</button>
    <div class="label ledger">${MONTHS[state.viewM]} ${state.viewY}</div>
    <button data-move="1">${icon('chevronR',16)}</button>
    ${!isCurrent ? `<button data-goto-today="1" class="today-btn">Aujourd'hui</button>` : ''}

}

function txRow(t, delBtn){

/* ---------------- Transactions ---------------- */
function renderTransactions(){
  const q = state.txQuery.trim().toLowerCase();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const list = state.data.transactions
    .filter(t => state.txFilter==='all' ? true : t.type===state.txFilter)
    .filter(t => !q || (t.note||'').toLowerCase().includes(q) || catInfo(t.category).label.toLowerCase().includes(q))
    .filter(t => !state.hidePastTx || new Date(t.date) >= todayStart)

    <div class="row" style="margin-bottom:14px;">

    <div class="row" style="margin-bottom:14px;">

/* ---------------- Budgets ---------------- */
let budgetEditingId = null;
function renderGaugeCard(stats){
  const tx = monthTx();
  const byCat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const hidden = state.data.hiddenBudgetCategories||[];
  const hiddenCount = hidden.length;
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));

  const nonRecurringCats = catsForType('expense').filter(c=>!recurringCatIds.has(c.id));
  const totalRollover = Object.values(state.data.categoryRollover||{}).reduce((s,v)=>s+v, 0);
  const globalLimit = nonRecurringCats.reduce((s,c)=> s + effectiveLimit(c.id), 0);
  const globalSpent = nonRecurringCats.reduce((s,c)=> s + (byCat[c.id]||0), 0);
  const globalPct = globalLimit>0 ? Math.min(100, Math.round(globalSpent/globalLimit*100)) : 0;
  const globalOver = globalLimit>0 && globalSpent>globalLimit;
  const remaining = Math.max(0, globalLimit - globalSpent);
  const alwaysShow = new Set(state.data.gaugeAlwaysShow||[]);
  const gaugeSegments = nonRecurringCats
    .map(c=>({ id:c.id, color:c.color, label:c.label, value: byCat[c.id]||0 }))
    .filter(s=>s.value>0 || alwaysShow.has(s.id))
    .sort((a,b)=>b.value-a.value);

  return `
    <div class="card">
      ${renderBalanceContent(stats, true)}
      <div style="height:1px; background:var(--line); margin:16px 0;"></div>
      ${globalLimit>0 ? `
        <div class="row" style="margin-bottom:14px; align-items:flex-start;">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="section-title" style="margin:0; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; letter-spacing:normal;">Total de mes enveloppes</div>
            <button data-open-gaugecat="1" class="btn-ghost" style="padding:9px 11px; font-size:13px; min-width:34px; min-height:34px; display:flex; align-items:center; justify-content:center;" title="Ajouter une catégorie">${icon('plus',14)}</button>
          </div>
          <span class="mono" style="font-size:14px; font-weight:600; color:var(--paper); line-height:1;">${globalPct}%</span>
        </div>
        <div class="catbar-track" style="height:18px; display:flex; overflow:hidden; gap:2px; border:1px solid var(--line);">
          ${gaugeSegments.map(s=>`<div style="width:${Math.min(100,(s.value/globalLimit*100))}%; background:${s.color}; height:100%;" title="${escapeHtml(s.label)}: ${fmt0(s.value)}"></div>`).join('')}
        </div>
        <div class="budget-foot" style="margin-top:10px; font-size:13.5px;">
          <span class="mono" style="color:${globalOver?'var(--coral)':'var(--paper)'}; font-weight:600;">${fmt2(globalSpent)}</span>
          <span style="color:var(--paperDim);">sur <span class="mono" style="color:var(--paper);">${fmt0(globalLimit)}</span></span>
        </div>
        <div style="height:1px; background:var(--line); margin:14px 0;"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;">
          ${gaugeSegments.map(s=>`
            <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
              <span style="font-size:12.5px; color:var(--paper); display:flex; align-items:center; gap:6px; min-width:0;">
                <span style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block; flex-shrink:0;"></span>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.label}</span>
              </span>
              <span style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                <span class="mono" style="font-size:12px; color:var(--paperDim);">${fmt0(s.value)}</span>
                <button data-quick-tx-cat="${s.id}" data-quick-tx-type="expense" class="quick-add-pastille" style="background:${s.color};" title="Ajouter une dépense">+</button>
              </span>
            </div>
          `).join('')}
        </div>
        ${remaining>0 ? `
          <div class="row" style="margin-top:14px; margin-bottom:0;">
            <span style="font-size:12.5px; color:var(--paperDim);">Reste à dépenser</span>
            <span class="mono" style="font-size:16px; font-weight:700; color:var(--mint);">${fmt0(remaining)}</span>
          </div>
        ` : ''}
        ${totalRollover>0 ? `
          <div class="row" style="margin-top:10px; margin-bottom:0;">
            <span style="font-size:11.5px; color:var(--paperDim);">${icon('repeat',11)} Report cumulé des mois précédents</span>
            <button data-allocate-rollover="1" data-remaining-amount="${totalRollover}" class="btn-ghost" style="font-size:11px; padding:6px 9px;">${fmt0(totalRollover)} → Épargner</button>
          </div>
        ` : ''}
      ` : `<div class="empty" style="padding:12px 0 16px;">Toutes les catégories sont masquées.</div>`}
      <div style="height:1px; background:var(--line); margin:16px 0;"></div>
      <button data-allocate-remaining="save" data-remaining-amount="${remaining}" class="btn-primary" style="width:100%; justify-content:center; font-size:13px;">${icon('faceid',14)} Épargne</button>
    </div>
  `;
}

function renderBudgets(){
  const tx = monthTx();
  const byCat = {};
  tx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const hidden = state.data.hiddenBudgetCategories||[];
  const allExpenseCats = catsForType('expense').filter(c=>!hidden.includes(c.id));
  const hiddenCount = hidden.length;
  const recurringCatIds = new Set((state.data.recurring||[]).filter(r=>r.type==='expense').map(r=>r.category));

  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Budgets par catégorie</div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${monthNav()}
        <button class="btn-ghost" data-open-managecat="1" style="padding:8px; display:flex;" title="Gérer les catégories">${icon('tag',15)}</button>
        ${hiddenCount ? `<button class="btn-ghost" data-open-hiddencat="1" style="font-size:11px; padding:8px; display:flex; align-items:center; gap:4px;" title="Catégories masquées">${icon('x',12)} ${hiddenCount}</button>` : ''}
      </div>
    </div>
    <div class="budget-stack">
      ${allExpenseCats.map(cat=>{
        const baseLimit = state.data.budgets[cat.id] || 0;
        const rollover = state.data.categoryRollover[cat.id] || 0;
        const limit = baseLimit + rollover;
        const spent = byCat[cat.id] || 0;
        const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
        const over = limit>0 && spent>limit;
        const barColor = over ? COLORS.coral : (pct>=80 ? COLORS.amber : cat.color);
        const editing = budgetEditingId === cat.id;
        const isRecurring = recurringCatIds.has(cat.id);
        const expanded = state.expandedBudgetCat === cat.id;
        const catTx = tx.filter(t=>t.type==='expense' && t.category===cat.id).sort((a,b)=> new Date(b.date)-new Date(a.date));
        return `
          <div class="card" style="margin-bottom:0; position:relative;">
            <div class="budget-head">
              <button data-toggle-budget-detail="${cat.id}" class="budget-cat" style="background:none; border:none; padding:0; cursor:pointer;">
                <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${cat.color};display:inline-block;"></span>${cat.label}
                ${isRecurring ? `<span title="Liée à une récurrence" style="color:var(--paperDim); display:flex;">${icon('repeat',12)}</span>` : ''}
                ${catTx.length>0 ? `<span style="color:var(--paperDim); display:flex; transform:rotate(${expanded?90:0}deg); transition:transform .15s;">${icon('chevronR',12)}</span>` : ''}
              </button>
              <div style="display:flex; align-items:center; gap:4px;">
                <button data-quick-tx-cat="${cat.id}" data-quick-tx-type="expense" class="quick-add-pastille" style="background:${cat.color}; margin-right:8px;" title="Ajouter une dépense">+</button>
                ${editing ? `<div class="budget-limit-edit"><input id="budgetInput-${cat.id}" type="number" value="${baseLimit}"><button data-save-budget="${cat.id}">OK</button></div>` : `<button class="budget-limit-btn" data-edit-budget="${cat.id}">limite : <span class="mono" style="color:var(--paper); font-size:16px;">${fmt0(baseLimit)}</span></button>`}
                <button data-hide-budgetcat="${cat.id}" style="color:var(--paperDim); padding:4px;" title="Masquer cette catégorie">${icon('x',13)}</button>
              </div>
            </div>
            <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${barColor};"></div></div>
            <div class="budget-foot"><span class="mono" style="color:${over?'var(--coral)':'var(--paperDim)'}">${fmt2(spent)} dépensés${changeBadge(pctChange(spent, prevMonthCatSpend(cat.id)),'down')}</span><span>${limit>0? pct+'%' : '—'}</span></div>
            ${rollover>0 ? `<div style="font-size:11px; color:var(--mint); margin-top:4px;">${icon('repeat',10)} +${fmt0(rollover)} reporté des mois précédents</div>` : ''}
            ${expanded && catTx.length>0 ? `
              <div style="margin-top:10px; border-top:1px solid var(--lineSoft); padding-top:6px;">
                ${catTx.map(t=>txRow(t,false)).join('')}
              </div>
            ` : ''}
            <div class="quick-chips" style="margin-top:10px;">
              ${[10,50].map(v=>`<button class="chip chip-add" data-budget-adjust="${cat.id}" data-amt="${v}">+${v}€</button>`).join('')}
              ${[10,50].map(v=>`<button class="chip chip-sub" data-budget-adjust="${cat.id}" data-amt="${-v}">−${v}€</button>`).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ---------------- Goals ---------------- */
function renderGoals(){
  const goals = state.data.goals;
  return `
    <div class="row" style="margin-bottom:14px;">
      <div class="section-title" style="margin:0;">Objectifs d'épargne</div>
      <button class="btn-primary" data-open="addGoal">${icon('plus',14)} Nouvel objectif</button>
    </div>
    ${goals.length===0 ? `<div class="card empty">Aucun objectif pour l'instant. Créez-en un pour commencer à mettre de côté.</div>` : `
      <div class="budget-stack">
        ${goals.map(g=>{
          const pct = g.target>0 ? Math.min(100, Math.round(g.current/g.target*100)) : 0;
          const done = pct>=100;
          const transfer = (state.data.goalTransfers||[]).find(t=>t.goalId===g.id);
          return `
            <div class="card goal-card" style="margin-bottom:0;">
              ${done ? `<div class="goal-badge">${icon('spark',11)} Atteint</div>` : ''}
              <div class="goal-name">${escapeHtml(g.name)}</div>
              <div class="goal-amt" style="color:${g.color}">${fmt0(g.current)} <span class="target">/ ${fmt0(g.target)}</span></div>
              <div class="catbar-track"><div class="catbar-fill" style="width:${pct}%; background:${g.color};"></div></div>
              <button data-open-goaltransfer="${g.id}" style="display:flex; align-items:center; gap:6px; margin-top:10px; color:${transfer?g.color:'var(--paperDim)'}; font-size:11.5px; background:none; border:none; padding:0;">
                ${icon('repeat',12)} ${transfer ? `${fmt0(transfer.amount)} ${freqLabel(transfer.frequency).toLowerCase()} — virement auto` : 'Configurer un virement automatique'}
              </button>
              ${g.deadline && !done ? (()=>{
                const dl = new Date(g.deadline);
                const now = new Date();
                const monthsLeft = Math.max(1, Math.round((dl - now) / (1000*60*60*24*30.44)));
                const remaining = Math.max(0, g.target - g.current);
                const perMonth = remaining / monthsLeft;
                const overdue = dl < now;
                return `<div style="font-size:11.5px; color:${overdue?'var(--coral)':'var(--paperDim)'}; margin-top:8px;">
                  ${overdue ? "Échéance dépassée" : `Échéance : ${dl.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}`}
                  ${!overdue ? ` · suggéré <span class="mono" style="color:${g.color};">${fmt0(perMonth)}</span>/mois` : ''}
                </div>`;
              })() : ''}
              <div class="quick-chips" style="margin-top:12px;">
                ${[10,50,100].map(v=>`<button class="chip chip-add" data-quick-contribute="${g.id}" data-amt="${v}">+${v}€</button>`).join('')}
                ${[10,50].map(v=>`<button class="chip chip-sub" data-quick-withdraw="${g.id}" data-amt="${v}">−${v}€</button>`).join('')}
              </div>
              <div class="goal-form">
                <input id="goalAmount-${g.id}" type="number" placeholder="Autre montant">
                <button class="add" data-contribute="${g.id}">Ajouter</button>
                <button class="withdraw" data-withdraw="${g.id}">Retirer</button>
                <button class="del" data-del-goal="${g.id}">${icon('trash',14)}</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

              </div>
            ` : `
              <label for="txPhotoInput" class="btn-ghost" style="display:inline-flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;">${icon('tag',14)} Ajouter une photo</label>
              <input id="txPhotoInput" type="file" accept="image/*" capture="environment" style="display:none;">
            `}

            <div class="row" style="margin-bottom:10px;">
              <label class="field-label" style="margin:0;">Transaction récurrente</label>
              <button data-toggle-recurring="1" class="toggle-switch ${txFormState.recurring?'on':''}">${txFormState.recurring?'Activée':'Désactivée'}</button>

      </div>

  `;
}

/* ---------------- events ---------------- */
function onTxSearch(v){ state.txQuery = v; rerender(); }
window.onTxSearch = onTxSearch;

function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.tab === state.tab) return;
    setState({tab: el.dataset.tab});
    window.scrollTo(0,0);
  }));
  app.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click', ()=> moveMonth(Number(el.dataset.move))));
  app.querySelectorAll('[data-goto-today]').forEach(el=>el.addEventListener('click', ()=>{
    const today = new Date();
    setState({ viewY: today.getFullYear(), viewM: today.getMonth() });
  }));
  app.querySelectorAll('[data-toggle-recent]').forEach(el=>el.addEventListener('click', ()=>{ state.recentExpanded = !state.recentExpanded; rerender(); }));
  app.querySelectorAll('[data-goto-month]').forEach(el=>el.addEventListener('click', ()=>{
    const [y,m] = el.dataset.gotoMonth.split('-').map(Number);
    setState({ viewY: y, viewM: m });
    window.scrollTo(0,0);
  }));
  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.open==='addTx'){ txFormState = { type:'expense', category:EXPENSE_CATS[0].id, date:defaultTxDate(), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null, photo:null, accountId: txFormState.accountId||'main' }; state.txAdvancedOpen = false; }
    if(el.dataset.open==='addGoal'){ goalFormState = { color: COLORS.sage }; }
    setState({modal: el.dataset.open});
  }));
  app.querySelectorAll('[data-quick-add]').forEach(el=>el.addEventListener('click', ()=>{
    const type = el.dataset.quickAdd;
    txFormState = { type, category:(type==='expense'?EXPENSE_CATS:INCOME_CATS)[0].id, date:defaultTxDate(), recurring:false, frequency:'monthly', note:'', amount:'', editingId:null, photo:null, accountId: txFormState.accountId||'main' };
    state.txAdvancedOpen = false;
    setState({modal:'addTx'});
    const amtEl = document.getElementById('txAmount');
    if(amtEl) amtEl.focus();
  }));
  app.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ setState({modal:null}); } }));
  app.querySelectorAll('[data-close-x-modal]').forEach(el=>el.addEventListener('click', ()=>{ setState({modal:null}); }));

  app.querySelectorAll('[data-del-tx]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.delTx;
    const tx = state.data.transactions.find(t=>t.id===id);
    if(!tx) return;
    mutateData(d=>{ d.transactions = d.transactions.filter(t=>t.id!==id); });
    showUndoToast('Transaction supprimée', ()=>{ mutateData(d=>{ d.transactions.unshift(tx); }); });
  }));
  app.querySelectorAll('[data-edit-tx]').forEach(el=>el.addEventListener('click', ()=>{ openEditTx(el.dataset.editTx); }));
  app.querySelectorAll('[data-view-tx]').forEach(el=>el.addEventListener('click', ()=>{ openEditTx(el.dataset.viewTx); }));
  app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click', ()=> setState({txFilter: el.dataset.filter})));
  app.querySelectorAll('[data-toggle-hide-past]').forEach(el=>el.addEventListener('click', ()=> setState({hidePastTx: !state.hidePastTx})));
  app.querySelectorAll('[data-toggle-budget-detail]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.toggleBudgetDetail;
    state.expandedBudgetCat = state.expandedBudgetCat===id ? null : id;
    rerender();
  }));

  app.querySelectorAll('[data-edit-budget]').forEach(el=>el.addEventListener('click', ()=>{ budgetEditingId = el.dataset.editBudget; rerender(); }));
  app.querySelectorAll('[data-save-budget]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.saveBudget;
    const input = document.getElementById('budgetInput-'+id);
    const val = Number(input.value)||0;
    budgetEditingId = null;
    mutateData(d=>{ d.budgets[id] = val; });
  }));
  app.querySelectorAll('[data-budget-adjust]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.budgetAdjust;
    const delta = Number(el.dataset.amt);
    let newLimit = 0;
    mutateData(d=>{
      const current = d.budgets[id] || 0;
      newLimit = Math.max(0, current + delta);
      d.budgets[id] = newLimit;
    });
    showToast(`Limite ${catInfo(id).label} : ${fmt0(newLimit)}`);
  }));

  app.querySelectorAll('[data-contribute]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.contribute;
    const input = document.getElementById('goalAmount-'+id);
    const amt = Number(input.value);
    if(amt>0) goalContribute(id, amt);
  }));
  app.querySelectorAll('[data-withdraw]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.withdraw;
    const input = document.getElementById('goalAmount-'+id);
    const amt = Number(input.value);
    if(amt>0) goalWithdraw(id, amt);
  }));
  app.querySelectorAll('[data-quick-contribute]').forEach(el=>el.addEventListener('click', ()=>{
    goalContribute(el.dataset.quickContribute, Number(el.dataset.amt));
  }));
  app.querySelectorAll('[data-quick-withdraw]').forEach(el=>el.addEventListener('click', ()=>{
    goalWithdraw(el.dataset.quickWithdraw, Number(el.dataset.amt));
  }));
  app.querySelectorAll('[data-del-goal]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.goals = d.goals.filter(g=>g.id!==el.dataset.delGoal); }); }));

  app.querySelectorAll('[data-tx-type]').forEach(el=>el.addEventListener('click', ()=>{
    txFormState.type = el.dataset.txType;
    txFormState.category = (el.dataset.txType==='expense'?EXPENSE_CATS:INCOME_CATS)[0].id;
    rerender();
  }));
  const txCategorySelect = app.querySelector('#txCategorySelect');
  if(txCategorySelect) txCategorySelect.addEventListener('change', ()=>{
    if(txCategorySelect.value==='__new__'){
      newCatFormState = { color: COLORS.slate, type: txFormState.type, label:'', editingId:null };
      state.categoryModalOpen = true;
      rerender();
      return;
    }
    txFormState.category = txCategorySelect.value;
  });
  app.querySelectorAll('[data-tx-account]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.accountId = el.dataset.txAccount; rerender(); }));
  app.querySelectorAll('[data-toggle-tx-advanced]').forEach(el=>el.addEventListener('click', ()=>{ state.txAdvancedOpen = !state.txAdvancedOpen; rerender(); }));
  app.querySelectorAll('[data-toggle-recurring]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.recurring = !txFormState.recurring; rerender(); }));
  app.querySelectorAll('[data-freq]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.frequency = el.dataset.freq; rerender(); }));

  const submitTx = app.querySelector('[data-submit-tx]');
  if(submitTx) submitTx.addEventListener('click', ()=>{
    const amount = Number(document.getElementById('txAmount').value);
    if(!amount || amount<=0) return;
    const noteEl = document.getElementById('txNote');
    const note = noteEl ? noteEl.value : (txFormState.note || '');
    const date = document.getElementById('txDate').value;
    const isoDate = new Date(date).toISOString();
    const photo = txFormState.photo || null;
    const accountId = txFormState.accountId || 'main';
    if(txFormState.editingId){
      const editId = txFormState.editingId;
      mutateData(d=>{
        const t = d.transactions.find(t=>t.id===editId);
        if(t){ t.type=txFormState.type; t.amount=amount; t.category=txFormState.category; t.note=note; t.date=isoDate; t.photo=photo; t.accountId=accountId; }
      });
      state.modal = null;
      showToast('Transaction modifiée');
      return;
    }
    mutateData(d=>{
      d.transactions.unshift({ id:uid(), type:txFormState.type, amount, category:txFormState.category, note, date: isoDate, photo, accountId });
      if(txFormState.recurring){
        d.recurring.push({ id:uid(), type:txFormState.type, amount, category:txFormState.category, note, frequency:txFormState.frequency, nextDate: addPeriod(isoDate, txFormState.frequency).toISOString() });
      }
    });
    state.modal = null;
    showToast(txFormState.recurring ? 'Récurrence créée' : (txFormState.type==='income' ? 'Entrée ajoutée' : 'Dépense ajoutée'));
  });
  const txPhotoInput = app.querySelector('#txPhotoInput');
  if(txPhotoInput) txPhotoInput.addEventListener('change', async ()=>{
    const file = txPhotoInput.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImage(file, 500, 0.6);
      txFormState.photo = dataUrl;
      rerender();
    }catch(e){ showToast("Impossible de charger l'image"); }
  });
  app.querySelectorAll('[data-remove-photo]').forEach(el=>el.addEventListener('click', ()=>{ txFormState.photo = null; rerender(); }));

  app.querySelectorAll('[data-goal-color]').forEach(el=>el.addEventListener('click', ()=>{ goalFormState.color = el.dataset.goalColor; rerender(); }));
  const submitGoal = app.querySelector('[data-submit-goal]');
  if(submitGoal) submitGoal.addEventListener('click', ()=>{
    const name = document.getElementById('goalName').value.trim();
    const target = Number(document.getElementById('goalTarget').value);
    const deadlineVal = document.getElementById('goalDeadline').value;
    if(!name || !target || target<=0) return;
    mutateData(d=>{ d.goals.push({ id:uid(), name, target, current:0, color:goalFormState.color, deadline: deadlineVal || null }); });
    state.modal = null;
    showToast('Objectif créé');
  });

  app.querySelectorAll('[data-open-newcat]').forEach(el=>el.addEventListener('click', ()=>{
    newCatFormState = { color: COLORS.slate, type: txFormState.type, label:'', editingId:null };
    state.categoryModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-open-newcat-standalone]').forEach(el=>el.addEventListener('click', ()=>{
    newCatFormState = { color: COLORS.slate, type: 'expense', label:'', editingId:null };
    state.categoryModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-edit-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const cat = (state.data.customCategories||[]).find(c=>c.id===el.dataset.editCat);
    if(!cat) return;
    newCatFormState = { color: cat.color, type: cat.type, label: cat.label, editingId: cat.id };
    state.categoryModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-close-newcat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.categoryModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-newcat]').forEach(el=>el.addEventListener('click', ()=>{ state.categoryModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-newcat-type]').forEach(el=>el.addEventListener('click', ()=>{ newCatFormState.type = el.dataset.newcatType; rerender(); }));
  app.querySelectorAll('[data-newcat-color]').forEach(el=>el.addEventListener('click', ()=>{ newCatFormState.color = el.dataset.newcatColor; rerender(); }));
  const submitNewCat = app.querySelector('[data-submit-newcat]');
  if(submitNewCat) submitNewCat.addEventListener('click', ()=>{
    const label = document.getElementById('newCatLabel').value.trim();
    if(!label) return;
    if(newCatFormState.editingId){
      const editId = newCatFormState.editingId;
      state.categoryModalOpen = false;
      mutateData(d=>{
        const cat = d.customCategories.find(c=>c.id===editId);
        if(cat){ cat.label=label; cat.color=newCatFormState.color; cat.type=newCatFormState.type; }
      });
      showToast('Catégorie modifiée');
      return;
    }
    const cat = { id:uid(), label, color:newCatFormState.color, type:newCatFormState.type };
    state.categoryModalOpen = false;
    mutateData(d=>{ d.customCategories.push(cat); });
    if(state.modal==='addTx' && txFormState.type===cat.type){ txFormState.category = cat.id; }
    showToast('Catégorie créée');
  });

  app.querySelectorAll('[data-open-managecat]').forEach(el=>el.addEventListener('click', ()=>{ state.manageCatOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-managecat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.manageCatOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-managecat]').forEach(el=>el.addEventListener('click', ()=>{ state.manageCatOpen=false; rerender(); }));
  app.querySelectorAll('[data-del-cat]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.customCategories = d.customCategories.filter(c=>c.id!==el.dataset.delCat); }); }));

  app.querySelectorAll('[data-open-recurmodal]').forEach(el=>el.addEventListener('click', ()=>{ state.recurringModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-recurmodal]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.recurringModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-recurmodal]').forEach(el=>el.addEventListener('click', ()=>{ state.recurringModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-del-recur]').forEach(el=>el.addEventListener('click', ()=>{ mutateData(d=>{ d.recurring = d.recurring.filter(r=>r.id!==el.dataset.delRecur); }); }));

  app.querySelectorAll('[data-toast-undo]').forEach(el=>el.addEventListener('click', ()=>{
    const undo = state.toast && state.toast.undo;
    state.toast = null;
    if(undo) undo();
    else rerender();
  }));

  app.querySelectorAll('[data-open-security]').forEach(el=>el.addEventListener('click', ()=>{
    state.pinSetupStep = null; state.pinSetupFirst = ''; state.pinConfirm = '';
    state.securityModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-close-security]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.securityModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-security]').forEach(el=>el.addEventListener('click', ()=>{ state.securityModalOpen=false; rerender(); }));

  app.querySelectorAll('[data-open-yearly]').forEach(el=>el.addEventListener('click', ()=>{
    state.reviewYear = new Date().getFullYear();
    state.yearlyReviewOpen = true;
    rerender();
  }));
  app.querySelectorAll('[data-close-yearly]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.yearlyReviewOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-yearly]').forEach(el=>el.addEventListener('click', ()=>{ state.yearlyReviewOpen=false; rerender(); }));
  app.querySelectorAll('[data-review-year]').forEach(el=>el.addEventListener('click', ()=>{
    state.reviewYear += Number(el.dataset.reviewYear);
    rerender();
  }));

  app.querySelectorAll('[data-open-goaltransfer]').forEach(el=>el.addEventListener('click', ()=>{
    const goalId = el.dataset.openGoaltransfer;
    const existing = (state.data.goalTransfers||[]).find(t=>t.goalId===goalId);
    state.goalTransferForm = existing ? { amount: existing.amount, frequency: existing.frequency } : { amount: 50, frequency: 'monthly' };
    state.editingGoalTransferId = goalId;
    rerender();
  }));
  app.querySelectorAll('[data-close-goaltransfer]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.editingGoalTransferId=null; rerender(); } }));
  app.querySelectorAll('[data-close-x-goaltransfer]').forEach(el=>el.addEventListener('click', ()=>{ state.editingGoalTransferId=null; rerender(); }));
  app.querySelectorAll('[data-goaltransfer-freq]').forEach(el=>el.addEventListener('click', ()=>{
    const amtEl = document.getElementById('goalTransferAmount');
    if(amtEl) state.goalTransferForm.amount = amtEl.value;
    state.goalTransferForm.frequency = el.dataset.goaltransferFreq;
    rerender();
  }));
  app.querySelectorAll('[data-save-goaltransfer]').forEach(el=>el.addEventListener('click', ()=>{
    const amount = Number(document.getElementById('goalTransferAmount').value);
    if(!amount || amount<=0) return;
    const goalId = state.editingGoalTransferId;
    const frequency = state.goalTransferForm.frequency;
    mutateData(d=>{
      if(!d.goalTransfers) d.goalTransfers = [];
      const existing = d.goalTransfers.find(t=>t.goalId===goalId);
      if(existing){
        existing.amount = amount;
        existing.frequency = frequency;
      } else {
        d.goalTransfers.push({ id: uid(), goalId, amount, frequency, nextDate: new Date().toISOString() });
      }
    });
    state.editingGoalTransferId = null;
    showToast('Virement automatique activé');
  }));
  app.querySelectorAll('[data-remove-goaltransfer]').forEach(el=>el.addEventListener('click', ()=>{
    const goalId = state.editingGoalTransferId;
    mutateData(d=>{ d.goalTransfers = (d.goalTransfers||[]).filter(t=>t.goalId!==goalId); });
    state.editingGoalTransferId = null;
    showToast('Virement automatique désactivé');
  }));

  app.querySelectorAll('[data-open-backup]').forEach(el=>el.addEventListener('click', ()=>{ state.backupModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-backup]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.backupModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-backup]').forEach(el=>el.addEventListener('click', ()=>{ state.backupModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-export-backup]').forEach(el=>el.addEventListener('click', ()=>{
    try{
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `solde-sauvegarde-${dateStr}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Sauvegarde téléchargée');
    }catch(e){ showToast('Impossible de créer la sauvegarde'); }
  }));
  const backupImportInput = app.querySelector('#backupImportInput');
  if(backupImportInput) backupImportInput.addEventListener('change', ()=>{
    const file = backupImportInput.files[0];
    if(!file) return;
    if(file.size > 30*1024*1024){ showToast('Fichier trop volumineux (max 30 Mo)'); return; }
    const reader = new FileReader();
    reader.onerror = ()=>{ showToast('Impossible de lire ce fichier'); };
    reader.onload = (e)=>{
      let parsed;
      try{
        parsed = JSON.parse(e.target.result);
      }catch(err){
        showToast("Ce fichier n'est pas une sauvegarde valide (JSON illisible)");
        return;
      }
      try{
        if(!parsed || typeof parsed !== 'object') throw new Error('format invalide');
        if(!Array.isArray(parsed.transactions)) throw new Error('transactions manquantes');
        if(!parsed.customCategories) parsed.customCategories = [];
        if(!parsed.recurring) parsed.recurring = [];
        if(!parsed.security) parsed.security = { enabled:false, pin:null, useBiometric:false, credentialId:null };
        if(!parsed.goals) parsed.goals = [];
        if(!parsed.budgets || typeof parsed.budgets !== 'object') parsed.budgets = {};
        if(!parsed.accounts || !parsed.accounts.length) parsed.accounts = [{ id:'main', name:'Compte principal', color: COLORS.gold }];
        if(!parsed.dashboardSettings) parsed.dashboardSettings = { showBreakdown:true, showTrend:true, showEnvelopesGauge:true, showForecast:true, showPinnedEnvelopes:true };
        if(!parsed.gaugeAlwaysShow) parsed.gaugeAlwaysShow = ['autres_d'];
        if(!parsed.categoryColorOverrides) parsed.categoryColorOverrides = {};
        if(!parsed.theme || !THEMES[parsed.theme]) parsed.theme = 'ledger';
        if(!parsed.pinnedCategories) parsed.pinnedCategories = [];
        if(!parsed.hiddenBudgetCategories) parsed.hiddenBudgetCategories = [];
        parsed.transactions.forEach(t=>{ if(!t.accountId) t.accountId = 'main'; });
        state.data = parsed;
        const ok = saveData(state.data);
        applyTheme(state.data.theme);
        state.backupModalOpen = false;
        showToast(ok ? 'Sauvegarde restaurée' : 'Restaurée en mémoire (stockage plein, non enregistrée)');
        rerender();
      }catch(err){
        showToast('Ce fichier ne correspond pas au format attendu');
      }
    };
    reader.readAsText(file);
  });

  app.querySelectorAll('[data-hide-card]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.hideCard;
    mutateData(d=>{ d.dashboardSettings[key] = false; });
    showToast('Carte masquée — réactivable dans Réglages');
  }));
  app.querySelectorAll('[data-toggle-card]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.toggleCard;
    mutateData(d=>{ d.dashboardSettings[key] = !d.dashboardSettings[key]; });
  }));
  app.querySelectorAll('[data-select-theme]').forEach(el=>el.addEventListener('click', ()=>{
    const theme = el.dataset.selectTheme;
    applyTheme(theme);
    mutateData(d=>{ d.theme = theme; });
    showToast(`Thème « ${THEMES[theme].name} » appliqué`);
  }));
  app.querySelectorAll('[data-open-accounts]').forEach(el=>el.addEventListener('click', ()=>{
    newAccountFormState = { color: COLORS.sage };
    state.accountsModalOpen = true; rerender();
  }));
  app.querySelectorAll('[data-close-accounts]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.accountsModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-accounts]').forEach(el=>el.addEventListener('click', ()=>{ state.accountsModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-newaccount-color]').forEach(el=>el.addEventListener('click', ()=>{ newAccountFormState.color = el.dataset.newaccountColor; rerender(); }));
  const submitAccount = app.querySelector('[data-submit-account]');
  if(submitAccount) submitAccount.addEventListener('click', ()=>{
    const name = document.getElementById('newAccountName').value.trim();
    if(!name) return;
    mutateData(d=>{ d.accounts.push({ id:uid(), name, color:newAccountFormState.color }); });
    showToast('Compte créé');
  });
  app.querySelectorAll('[data-del-account]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.delAccount;
    if((state.data.accounts||[]).length<=1) return;
    mutateData(d=>{
      d.accounts = d.accounts.filter(a=>a.id!==id);
      const fallback = d.accounts[0].id;
      d.transactions.forEach(t=>{ if(t.accountId===id) t.accountId = fallback; });
    });
    showToast('Compte supprimé, transactions transférées');
  }));

  app.querySelectorAll('[data-quick-tx-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.quickTxCat;
    const type = el.dataset.quickTxType;
    quickTxFormState = { category:catId, type, date:defaultTxDate(), amount:'', note:'', photo:null };
    state.manageCatOpen = false;
    state.quickTxOpen = true;
    rerender();
    const amtEl = document.getElementById('quickTxAmount');
    if(amtEl) amtEl.focus();
  }));
  app.querySelectorAll('[data-close-quicktx]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.quickTxOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-quicktx]').forEach(el=>el.addEventListener('click', ()=>{ state.quickTxOpen=false; rerender(); }));
  const quickTxPhotoInput = app.querySelector('#quickTxPhotoInput');
  if(quickTxPhotoInput) quickTxPhotoInput.addEventListener('change', async ()=>{
    const file = quickTxPhotoInput.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImage(file, 500, 0.6);
      quickTxFormState.photo = dataUrl;
      rerender();
    }catch(e){ showToast("Impossible de charger l'image"); }
  });
  app.querySelectorAll('[data-remove-quickphoto]').forEach(el=>el.addEventListener('click', ()=>{ quickTxFormState.photo = null; rerender(); }));
  const submitQuickTx = app.querySelector('[data-submit-quicktx]');
  if(submitQuickTx) submitQuickTx.addEventListener('click', ()=>{
    const amount = Number(document.getElementById('quickTxAmount').value);
    if(!amount || amount<=0) return;
    const date = document.getElementById('quickTxDate').value;
    const note = document.getElementById('quickTxNote').value;
    const isoDate = new Date(date).toISOString();
    mutateData(d=>{
      d.transactions.unshift({ id:uid(), type:quickTxFormState.type, amount, category:quickTxFormState.category, note, date: isoDate, photo:quickTxFormState.photo, accountId:'main' });
    });
    state.quickTxOpen = false;
    showToast(quickTxFormState.type==='income' ? 'Entrée ajoutée' : 'Dépense ajoutée');
  });

  app.querySelectorAll('[data-hide-budgetcat]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.hideBudgetcat;
    mutateData(d=>{ if(!d.hiddenBudgetCategories.includes(id)) d.hiddenBudgetCategories.push(id); });
    showToast('Catégorie masquée');
  }));
  app.querySelectorAll('[data-hide-all-cats]').forEach(el=>el.addEventListener('click', ()=>{
    const allIds = catsForType('expense').map(c=>c.id);
    mutateData(d=>{ d.hiddenBudgetCategories = allIds; });
    showToast('Toutes les catégories masquées');
  }));
  app.querySelectorAll('[data-show-all-cats]').forEach(el=>el.addEventListener('click', ()=>{
    mutateData(d=>{ d.hiddenBudgetCategories = []; });
    showToast('Toutes les catégories affichées');
  }));
  app.querySelectorAll('[data-open-hiddencat]').forEach(el=>el.addEventListener('click', ()=>{ state.hiddenCatModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-hiddencat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.hiddenCatModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-hiddencat]').forEach(el=>el.addEventListener('click', ()=>{ state.hiddenCatModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-unhide-budgetcat]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.unhideBudgetcat;
    mutateData(d=>{ d.hiddenBudgetCategories = d.hiddenBudgetCategories.filter(c=>c!==id); });
  }));

  app.querySelectorAll('[data-allocate-remaining]').forEach(el=>el.addEventListener('click', ()=>{
    const amount = Number(el.dataset.remainingAmount) || 0;
    state.allocateAmount = amount;
    state.allocateGoalMode = 'add';
    state.allocateIsRollover = false;
    state.allocateModalOpen = true;
    rerender();
  }));
  app.querySelectorAll('[data-allocate-rollover]').forEach(el=>el.addEventListener('click', ()=>{
    const amount = Number(el.dataset.remainingAmount) || 0;
    state.allocateAmount = amount;
    state.allocateGoalMode = 'add';
    state.allocateIsRollover = true;
    state.allocateModalOpen = true;
    rerender();
  }));
  app.querySelectorAll('[data-close-allocate]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.allocateModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-allocate]').forEach(el=>el.addEventListener('click', ()=>{ state.allocateModalOpen=false; rerender(); }));

  app.querySelectorAll('[data-open-pincat]').forEach(el=>el.addEventListener('click', ()=>{ state.pinCatModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-pincat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.pinCatModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-pincat]').forEach(el=>el.addEventListener('click', ()=>{ state.pinCatModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-pin-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.pinCat;
    mutateData(d=>{ if(!d.pinnedCategories.includes(catId)) d.pinnedCategories.push(catId); });
    state.pinCatModalOpen = false;
    showToast('Catégorie épinglée');
  }));
  app.querySelectorAll('[data-unpin-cat]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.unpinCat;
    mutateData(d=>{ d.pinnedCategories = d.pinnedCategories.filter(id=>id!==catId); });
  }));

  app.querySelectorAll('[data-open-gaugecat]').forEach(el=>el.addEventListener('click', ()=>{ state.gaugeCatModalOpen = true; rerender(); }));
  app.querySelectorAll('[data-close-gaugecat]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.gaugeCatModalOpen=false; rerender(); } }));
  app.querySelectorAll('[data-close-x-gaugecat]').forEach(el=>el.addEventListener('click', ()=>{ state.gaugeCatModalOpen=false; rerender(); }));
  app.querySelectorAll('[data-gaugecat-add]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.gaugecatAdd;
    mutateData(d=>{ if(!d.gaugeAlwaysShow.includes(catId)) d.gaugeAlwaysShow.push(catId); });
    showToast('Catégorie toujours affichée');
  }));
  app.querySelectorAll('[data-gaugecat-remove]').forEach(el=>el.addEventListener('click', ()=>{
    const catId = el.dataset.gaugecatRemove;
    mutateData(d=>{ d.gaugeAlwaysShow = d.gaugeAlwaysShow.filter(id=>id!==catId); });
    showToast('Catégorie retirée');
  }));

  app.querySelectorAll('[data-edit-builtin-color]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingBuiltinColorId = el.dataset.editBuiltinColor;
    rerender();
  }));
  app.querySelectorAll('[data-close-builtincolor]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target===el){ state.editingBuiltinColorId=null; rerender(); } }));
  app.querySelectorAll('[data-close-x-builtincolor]').forEach(el=>el.addEventListener('click', ()=>{ state.editingBuiltinColorId=null; rerender(); }));
  app.querySelectorAll('[data-builtincolor-pick]').forEach(el=>el.addEventListener('click', ()=>{
    const id = state.editingBuiltinColorId;
    const color = el.dataset.builtincolorPick;
    mutateData(d=>{ d.categoryColorOverrides[id] = color; });
    state.editingBuiltinColorId = null;
    showToast('Couleur mise à jour');
  }));
  app.querySelectorAll('[data-builtincolor-reset]').forEach(el=>el.addEventListener('click', ()=>{
    const id = state.editingBuiltinColorId;
    mutateData(d=>{ delete d.categoryColorOverrides[id]; });
    state.editingBuiltinColorId = null;
    showToast('Couleur réinitialisée');
  }));
  app.querySelectorAll('[data-allocate-mode]').forEach(el=>el.addEventListener('click', ()=>{
    state.allocateGoalMode = el.dataset.allocateMode;
    rerender();
  }));
  app.querySelectorAll('[data-allocate-to-goal]').forEach(el=>el.addEventListener('click', ()=>{
    const goalId = el.dataset.allocateToGoal;
    const input = document.getElementById('allocateAmountInput');
    const amount = Number(input ? input.value : state.allocateAmount);
    if(!amount || amount<=0) return;
    state.allocateModalOpen = false;
    if(state.allocateGoalMode==='withdraw'){ goalWithdraw(goalId, amount); }
    else {
      goalContribute(goalId, amount);
      if(state.allocateIsRollover){
        mutateData(d=>{ d.categoryRollover = {}; });
      }
    }
    state.allocateIsRollover = false;
  }));
  app.querySelectorAll('[data-setup-key]').forEach(el=>el.addEventListener('click', ()=>{ handleSetupDigit(el.dataset.setupKey); }));
  app.querySelectorAll('[data-setup-backspace]').forEach(el=>el.addEventListener('click', handleSetupBackspace));
  app.querySelectorAll('[data-enable-biometric]').forEach(el=>el.addEventListener('click', registerBiometric));
  app.querySelectorAll('[data-disable-lock]').forEach(el=>el.addEventListener('click', disableLock));
  app.querySelectorAll('[data-pin-key]').forEach(el=>el.addEventListener('click', ()=>{ handlePinDigit(el.dataset.pinKey); }));
  app.querySelectorAll('[data-pin-backspace]').forEach(el=>el.addEventListener('click', ()=>{ state.pinInput = state.pinInput.slice(0,-1); rerender(); }));
  app.querySelectorAll('[data-pin-biometric]').forEach(el=>el.addEventListener('click', tryBiometricUnlock));

  if(state.locked && state.data.security && state.data.security.useBiometric && !state.triedBiometricAuto){
    state.triedBiometricAuto = true;
    tryBiometricUnlock();
  }

  const balEl = document.getElementById('balanceNum');
  if(balEl){
    const today0 = new Date();
    const f0 = computeForecast();
    const target0 = balanceForViewedMonth(f0, state.viewY, state.viewM);
    animateBalance(balEl, target0);
  }

  const pageEl = app.querySelector('.page');
  if(pageEl){
    let sx=null, sy=null, sInScroll=false;
    pageEl.addEventListener('touchstart', (e)=>{
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      sInScroll = !!e.target.closest('.trend-scroll');
    }, {passive:true});
    pageEl.addEventListener('touchend', (e)=>{
      if(sx===null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      const wasInScroll = sInScroll;
      sx = null; sInScroll = false;
      if(wasInScroll) return;
      if(Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)*1.6){
        const order = ['dashboard','transactions','budgets','goals'];
        const idx = order.indexOf(state.tab);
        let next = idx;
        if(dx < 0 && idx < order.length-1) next = idx+1;
        if(dx > 0 && idx > 0) next = idx-1;
        if(next !== idx){ setState({tab: order[next]}); window.scrollTo(0,0); }
      }
    }, {passive:true});
  }
  const trendScroll = app.querySelector('.trend-scroll');
  if(trendScroll){ trendScroll.scrollLeft = trendScroll.scrollWidth; }
}

function animateBalance(el, target){
  if(state.balanceAnim.raf) cancelAnimationFrame(state.balanceAnim.raf);
  const from = state.balanceAnim.display;
  const start = performance.now();
  const duration = 650;
  function step(ts){
    const p = Math.min(1, (ts-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = from + (target-from)*eased;
    state.balanceAnim.display = val;
    el.textContent = fmt0(val);
    if(p<1){ state.balanceAnim.raf = requestAnimationFrame(step); }
    else { state.balanceAnim.target = target; }
  }
  state.balanceAnim.raf = requestAnimationFrame(step);
}

rerender();
if(window.__soldeDataWasCorrupted){
  setTimeout(()=>{ showToast("Anciennes données illisibles — appli réinitialisée (sauvegarde technique conservée)"); }, 600);
}
</script>
</body>
</html>
